    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // Base questions to populate the 80/180 array dynamically
        const baseQuestions = [
            {
                q: "Seorang laki-laki berusia 50 tahun dirawat di ruang penyakit dalam dengan keluhan sesak napas. Hasil pengkajian: batuk berdahak, terdengar ronchi di kedua lapang paru, RR 28x/mnt, HR 90x/mnt, TD 130/80 mmHg. Apakah tindakan keperawatan prioritas pada kasus tersebut?",
                options: [
                    "Memberikan posisi semi fowler",
                    "Mengajarkan batuk efektif",
                    "Memberikan oksigen 3 liter/menit",
                    "Melakukan fisioterapi dada",
                    "Kolaborasi pemberian bronkodilator"
                ],
                correct: 1, // Index 1: Mengajarkan batuk efektif
                explanation: "Pasien mengalami masalah 'Bersihan Jalan Napas Tidak Efektif' ditandai dengan batuk berdahak dan suara ronchi. Tindakan mandiri keperawatan prioritas adalah mengajarkan teknik batuk efektif untuk membantu mengeluarkan sekret yang menumpuk di jalan napas.\n\nAnalisis Pilihan Lain:\n• A (Semi fowler): Benar untuk keluhan sesak napas, namun tidak menyelesaikan masalah utama penumpukan sekret.\n• C (Oksigen 3L/menit): Tidak secara langsung membersihkan jalan napas dari sekret kental.\n• D (Fisioterapi dada): Merupakan intervensi lanjutan, bukan prioritas pertama sebelum mencoba batuk efektif yang lebih non-invasif.\n• E (Bronkodilator): Merupakan tindakan kolaboratif medis, bukan tindakan mandiri keperawatan pertama yang harus dilakukan."
            },
            {
                q: "Seorang perempuan berusia 35 tahun, G2P1A0 hamil 32 minggu, datang ke poliklinik KIA untuk memeriksakan kehamilan. Hasil pengkajian: TD 140/90 mmHg, Nadi 88x/menit, edema pada kedua tungkai, protein urine (+). Apakah komplikasi yang paling mungkin terjadi pada kasus tersebut?",
                options: [
                    "Plasenta previa",
                    "Solusio plasenta",
                    "Preeklamsia ringan",
                    "Preeklamsia berat",
                    "Hipertensi kronis"
                ],
                correct: 2, // Index 2: Preeklamsia ringan
                explanation: "Data fokus menunjukkan ibu hamil usia >20 minggu dengan tekanan darah 140/90 mmHg, disertai temuan proteinuria (+) dan edema. Tanda-tanda klinis tersebut merupakan trias klasik dari diagnosis Preeklamsia Ringan pada masa kehamilan.\n\nAnalisis Pilihan Lain:\n• A (Plasenta previa): Gejala khasnya adalah perdarahan jalan lahir tanpa disertai nyeri, tidak sesuai kasus.\n• B (Solusio plasenta): Gejala khasnya adalah perdarahan dengan nyeri perut hebat dan uterus tegang.\n• D (Preeklamsia berat): Belum tepat karena kriteria berat membutuhkan TD ≥160/110 mmHg atau protein urine ≥(+3) disertai gejala penyerta lain.\n• E (Hipertensi kronis): Tekanan darah tinggi pada ibu hamil yang sudah terdeteksi sejak sebelum usia kehamilan 20 minggu."
            },
            {
                q: "Anak laki-laki berusia 2 tahun dibawa ibunya ke UGD dengan keluhan BAB cair >5 kali sehari sejak kemarin. Hasil pengkajian: anak tampak rewel, mata cekung, turgor kulit kembali lambat, mukosa bibir kering, Nadi 120x/menit, Suhu 38.5°C. Apakah masalah keperawatan utama pada kasus tersebut?",
                options: [
                    "Diare",
                    "Hipertermia",
                    "Defisit nutrisi",
                    "Hipovolemia",
                    "Risiko syok"
                ],
                correct: 3, // Index 3: Hipovolemia
                explanation: "Anak mengalami tanda dehidrasi nyata (mata cekung, turgor kulit kembali lambat, mukosa kering) akibat kehilangan cairan aktif (BAB cair >5x). Dalam prinsip kegawatdaruratan (Circulation), masalah utama yang mengancam nyawa adalah Hipovolemia (kekurangan volume cairan).\n\nAnalisis Pilihan Lain:\n• A (Diare): Diare adalah etiologi atau penyebab hilangnya cairan, bukan dampak akhir kegawatdaruratan yang membahayakan nyawa saat ini.\n• B (Hipertermia): Merupakan gejala penyerta akibat dehidrasi atau infeksi, bukan prioritas utama dibandingkan sirkulasi cairan.\n• C (Defisit nutrisi): Merupakan masalah jangka panjang, tidak mematikan dalam hitungan jam/hari dibandingkan hipovolemia.\n• E (Risiko syok): Kondisi anak sudah masuk fase aktual (sudah hipovolemia), bukan lagi sekadar risiko."
            },
            {
                q: "Seorang laki-laki berusia 25 tahun dirawat di RS Jiwa. Saat dikaji, pasien tampak menyendiri di pojok ruangan, sering tersenyum dan berbicara sendiri, serta sesekali menutup telinga. Apakah intervensi keperawatan pertama yang tepat untuk pasien tersebut?",
                options: [
                    "Mengajarkan cara menghardik",
                    "Membantu pasien mengenal halusinasinya",
                    "Mengajak pasien bercakap-cakap dengan perawat",
                    "Melibatkan pasien dalam kegiatan kelompok",
                    "Memberikan obat antipsikotik sesuai program"
                ],
                correct: 1, // Index 1: Membantu pasien mengenal halusinasinya
                explanation: "Pasien menunjukkan tanda-tanda halusinasi pendengaran yang aktif (bicara sendiri, menutup telinga). Berdasarkan Standar Asuhan Keperawatan Jiwa untuk SP 1 (Strategi Pelaksanaan 1) Halusinasi, langkah awal wajib adalah membantu pasien mengenali halusinasinya (isi, frekuensi, waktu, pencetus, dan perasaannya).\n\nAnalisis Pilihan Lain:\n• A (Menghardik): Cara mengontrol halusinasi yang diajarkan SETELAH pasien sadar dan mengenali halusinasinya terlebih dahulu.\n• C (Bercakap-cakap): Ini adalah strategi pelaksanaan (SP) lanjutan (SP 3) untuk mendistraksi pasien dari halusinasi.\n• D (Kegiatan kelompok): Terlalu dini, pasien masih asyik dengan dunia halusinasinya sehingga belum siap berinteraksi sosial.\n• E (Obat antipsikotik): Intervensi kolaboratif penting, namun tindakan komunikasi terapeutik pertama perawat tetaplah validasi/pengenalan masalah."
            },
            {
                q: "Terjadi kecelakaan lalu lintas beruntun. Perawat di tempat kejadian menemukan seorang korban laki-laki dewasa yang tidak sadarkan diri, terdapat jejas di area dada dan leher, napas mengorok (snoring). Apakah tindakan pertama yang harus dilakukan perawat?",
                options: [
                    "Melakukan RJP (Resusitasi Jantung Paru)",
                    "Membuka jalan napas dengan teknik Jaw Thrust",
                    "Membuka jalan napas dengan teknik Head Tilt Chin Lift",
                    "Memasang cervical collar",
                    "Memberikan napas buatan (rescue breathing)"
                ],
                correct: 1, // Index 1: Jaw Thrust
                explanation: "Pasien tidak sadar dengan napas mengorok (snoring) menandakan jatuhnya pangkal lidah menyumbat jalan napas. Jejas di atas klavikula (leher dan dada) mengindikasikan kecurigaan cedera servikal. Maka manuver pembebasan jalan napas paling aman tanpa mengekstensikan leher adalah Jaw Thrust.\n\nAnalisis Pilihan Lain:\n• A (RJP): Belum ada indikasi henti jantung karena korban terbukti masih bernapas (terdengar suara ngorok/snoring).\n• C (Head Tilt Chin Lift): Sangat dikontraindikasikan karena manipulasi ekstensi kepala dapat memperparah cedera saraf tulang belakang (servikal).\n• D (Cervical collar): Pemasangan kolar leher penting, tetapi prioritas mutlak A (Airway/Jalan Napas) harus diatasi/dibuka terlebih dahulu.\n• E (Napas buatan): Tidak efektif jika jalan napas masih tersumbat oleh pangkal lidah secara mekanik."
            }
        ];

        // Generate full exam dynamically

                            <div className="mt-8">
                                <button

        const ProgramSelection = ({ onSelect }) => {
            return (
                <div className="min-h-screen bg-slate-50 p-4 lg:p-8 flex items-center justify-center animate-fade-in">
                    <div className="max-w-4xl w-full">

                            <p className="text-slate-500 text-lg">Pilih program ujian kompetensi Anda untuk menyesuaikan jumlah soal dan waktu tryout.</p>
                        </div>

                        <div className="grid md:grid-cols-2 gap-6">
                            {/* D3 Card */}

                                onClick={() => onSelect({ type: 'D3', questions: 80, timeMinutes: 80 })}
                                className="group bg-white p-8 rounded-3xl border-2 border-slate-100 hover:border-brand-500 cursor-pointer transition-all duration-300 shadow-sm hover:shadow-xl hover:shadow-brand-500/10 hover:-translate-y-1"
                            >

                            </div>

                            {/* Ners Card */}

                            >

        const CBTEngine = ({ config, onFinish }) => {
            const [questions, setQuestions] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [answers, setAnswers] = useState({});
            const [timeLeft, setTimeLeft] = useState(config.timeMinutes * 60);
            const [showConfirmModal, setShowConfirmModal] = useState(false);

            useEffect(() => {
                // Initialize questions
                setQuestions(generateExamData(config.questions));
            }, [config]);

            // Timer Logic
            useEffect(() => {
                const timer = setInterval(() => {
                    setTimeLeft((prev) => {
                        if (prev <= 1) {
                            clearInterval(timer);
                            handleFinishExam();
                            return 0;
                        }
                        return prev - 1;
                    });
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            const formatTime = (seconds) => {
                const h = Math.floor(seconds / 3600);
                const m = Math.floor((seconds % 3600) / 60);
                const s = seconds % 60;
                return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            };

            const handleAnswer = (optionIndex) => {
                setAnswers(prev => ({
                    ...prev,
                    [currentIndex]: optionIndex
                }));
            };

            const handleFinishExam = () => {
                onFinish(questions, answers);
            };

            const currentQ = questions[currentIndex];
            const answeredCount = Object.keys(answers).length;
            const isCriticalTime = timeLeft < 300; // less than 5 minutes

            if (!currentQ) return <div className="min-h-screen flex items-center justify-center">Loading...</div>;

            return (
                <div className="h-screen flex flex-col bg-slate-100 overflow-hidden animate-fade-in">
                    {/* Header Navbar */}
                    <header className="h-16 bg-white border-b border-slate-200 shrink-0 flex items-center justify-between px-4 lg:px-8 shadow-sm relative z-20">
                        <div className="flex items-center gap-3">
                            <div className="w-8 h-8 bg-brand-600 rounded-lg flex items-center justify-center text-white">
                                <Icons.BookOpen />
                            </div>
                            <h1 className="font-bold text-slate-800 hidden md:block">UKOM CBT - {config.type}</h1>
                        </div>
                        
                        {/* Timer */}
                        <div className={`flex items-center gap-2 px-4 py-2 rounded-full font-mono font-bold text-lg transition-colors ${isCriticalTime ? 'bg-red-100 text-red-600 animate-pulse' : 'bg-slate-100 text-slate-700'}`}>
                            <Icons.Clock />
                            {formatTime(timeLeft)}
                        </div>

                        <button 
                            onClick={() => setShowConfirmModal(true)}
                            className="bg-brand-600 hover:bg-brand-700 text-white px-6 py-2 rounded-lg font-semibold transition-colors shadow-md shadow-brand-500/20"
                        >
                            Selesai
                        </button>
                    </header>

                    {/* Main Content Area */}
                    <div className="flex-1 flex flex-col md:flex-row overflow-hidden relative">
                        
                        {/* Left Column: Question Area */}
                        <div className="flex-1 flex flex-col overflow-y-auto p-4 lg:p-8 scroll-smooth">
                            <div className="max-w-4xl w-full mx-auto animate-slide-up" key={currentIndex}>
                                
                                {/* Question Card */}
                                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 lg:p-8 mb-6">
                                    <div className="flex items-center gap-3 mb-6 pb-6 border-b border-slate-100">
                                        <span className="bg-brand-100 text-brand-700 font-bold px-3 py-1 rounded-lg text-sm">
                                            Soal No. {currentIndex + 1}
                                        </span>
                                        <span className="text-slate-400 text-sm">
                                            dari {config.questions} Soal
                                        </span>
                                    </div>
                                    <p className="text-lg text-slate-800 leading-relaxed font-medium mb-8">
                                        {currentQ.q}
                                    </p>
                                    
                                    <div className="space-y-3">
                                        {currentQ.options.map((opt, i) => {
                                            const isSelected = answers[currentIndex] === i;
                                            return (
                                                <div 
                                                    key={i}
                                                    onClick={() => handleAnswer(i)}
                                                    className={`w-full text-left p-4 rounded-xl border-2 transition-all duration-200 cursor-pointer flex gap-4 items-start
                                                        ${isSelected 
                                                            ? 'border-brand-500 bg-brand-50 shadow-sm' 
                                                            : 'border-slate-200 hover:border-brand-300 hover:bg-slate-50'}`}
                                                >
                                                    <div className={`w-6 h-6 shrink-0 rounded-full border-2 flex items-center justify-center mt-0.5
                                                        ${isSelected ? 'border-brand-500' : 'border-slate-300'}`}
                                                    >
                                                        {isSelected && <div className="w-3 h-3 bg-brand-500 rounded-full"></div>}
                                                    </div>
                                                    <span className={`text-base ${isSelected ? 'text-brand-900 font-semibold' : 'text-slate-700'}`}>
                                                        {opt}
                                                    </span>
                                                </div>
                                            )
                                        })}
                                    </div>
                                </div>

                                {/* Navigation Buttons */}
                                <div className="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                                    <button 
                                        onClick={() => setCurrentIndex(prev => Math.max(0, prev - 1))}
                                        disabled={currentIndex === 0}
                                        className="flex items-center gap-2 px-6 py-3 rounded-xl font-semibold text-slate-600 hover:bg-slate-100 disabled:opacity-50 transition-colors"
                                    >
                                        <Icons.ArrowLeft /> Sebelumnya
                                    </button>
                                    
                                    <button 
                                        onClick={() => setCurrentIndex(prev => Math.min(questions.length - 1, prev + 1))}
                                        disabled={currentIndex === questions.length - 1}
                                        className="flex items-center gap-2 px-6 py-3 rounded-xl font-semibold text-white bg-slate-800 hover:bg-slate-900 disabled:opacity-50 transition-colors shadow-md"
                                    >
                                        Selanjutnya <Icons.ArrowRight />
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* Right Column: Question Nav Grid */}
                        <div className="w-full md:w-80 lg:w-96 bg-white border-l border-slate-200 flex flex-col shrink-0 h-64 md:h-auto z-10 shadow-lg md:shadow-none">
                            <div className="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
                                <h3 className="font-bold text-slate-700">Navigasi Soal</h3>
                                <div className="text-sm text-slate-500 font-medium">
                                    <span className="text-emerald-600">{answeredCount}</span> / {config.questions} Dijawab
                                </div>
                            </div>
                            
                            {/* Legend */}
                            <div className="flex justify-center gap-4 p-3 border-b border-slate-100 text-xs font-medium">
                                <div className="flex items-center gap-1.5 text-emerald-700">
                                    <div className="w-3 h-3 rounded bg-emerald-500"></div> Sudah
                                </div>
                                <div className="flex items-center gap-1.5 text-rose-700">
                                    <div className="w-3 h-3 rounded bg-rose-500"></div> Belum
                                </div>
                            </div>

                            <div className="p-4 overflow-y-auto flex-1 grid grid-cols-5 gap-2 content-start">
                                {questions.map((_, idx) => {
                                    const isAnswered = answers[idx] !== undefined;
                                    const isActive = currentIndex === idx;
                                    
                                    // Merah = belum dijawab, Hijau = sudah dijawab
                                    let btnClass = "w-full aspect-square flex items-center justify-center rounded-lg text-sm font-bold transition-all ";
                                    
                                    if (isAnswered) {
                                        btnClass += "bg-emerald-500 text-white shadow-sm shadow-emerald-500/30 hover:bg-emerald-600 ";
                                    } else {
                                        btnClass += "bg-rose-500 text-white shadow-sm shadow-rose-500/30 hover:bg-rose-600 ";
                                    }

                                    if (isActive) {
                                        btnClass += "ring-4 ring-brand-300 ring-offset-1 transform scale-110 z-10 ";
                                    }

                                    return (
                                        <button 
                                            key={idx}
                                            onClick={() => setCurrentIndex(idx)}
                                            className={btnClass}
                                        >
                                            {idx + 1}
                                        </button>
                                    );
                                })}
                            </div>
                        </div>

                    </div>

                    {/* Confirmation Modal */}
                    {showConfirmModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in">
                            <div className="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl scale-100 animate-slide-up">
                                <h3 className="text-2xl font-bold text-slate-800 mb-2">Selesai Tryout?</h3>
                                <p className="text-slate-600 mb-6">
                                    Anda telah menjawab <strong className="text-slate-800">{answeredCount}</strong> dari <strong className="text-slate-800">{config.questions}</strong> soal. Waktu tersisa: <strong>{formatTime(timeLeft)}</strong>.
                                    Yakin ingin menyelesaikan sekarang?
                                </p>
                                <div className="flex gap-3">
                                    <button 
                                        onClick={() => setShowConfirmModal(false)}
                                        className="flex-1 px-4 py-3 rounded-xl font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 transition-colors"
                                    >
                                        Batal
                                    </button>
                                    <button 
                                        onClick={handleFinishExam}
                                        className="flex-1 px-4 py-3 rounded-xl font-bold text-white bg-brand-600 hover:bg-brand-700 shadow-lg shadow-brand-500/30 transition-colors"
                                    >
                                        Ya, Kumpulkan
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const ResultScreen = ({ questions, answers, config, onRestart }) => {
            // Calculate Score
            let correctCount = 0;
            questions.forEach((q, idx) => {
                if (answers[idx] === q.correct) correctCount++;
            });
            const score = Math.round((correctCount / config.questions) * 100);
            const wrongCount = Object.keys(answers).length - correctCount;
            const emptyCount = config.questions - Object.keys(answers).length;

            return (
                <div className="min-h-screen bg-slate-50 p-4 lg:p-8 animate-fade-in">
                    <div className="max-w-5xl mx-auto">
                        
                        {/* Header & Score Summary */}
                        <div className="bg-white rounded-3xl shadow-sm border border-slate-200 p-8 mb-8 text-center relative overflow-hidden">
                            <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-brand-400 to-teal-400"></div>
                            <h1 className="text-3xl font-bold text-slate-800 mb-2">Hasil Tryout {config.type}</h1>
                            <p className="text-slate-500 mb-8">Berikut adalah rekapitulasi nilai dan pembahasan soal Anda.</p>
                            
                            <div className="flex flex-col md:flex-row items-center justify-center gap-8 md:gap-16">
                                {/* Score Circle */}
                                <div className="relative w-48 h-48 flex items-center justify-center rounded-full border-[12px] border-slate-100 shadow-inner">
                                    {/* Using inline style for circular progress simulation. For real SVG, it's better, but a solid border works as a fallback */}
                                    <svg className="absolute inset-0 w-full h-full -rotate-90" viewBox="0 0 100 100">
                                        <circle cx="50" cy="50" r="44" fill="none" stroke="#e2e8f0" strokeWidth="12" />
                                        <circle cx="50" cy="50" r="44" fill="none" stroke={score >= 60 ? "#10b981" : "#ef4444"} strokeWidth="12" strokeDasharray="276" strokeDashoffset={276 - (276 * score) / 100} strokeLinecap="round" className="transition-all duration-1000 ease-out" />
                                    </svg>
                                    <div className="text-center z-10">
                                        <span className="text-5xl font-black text-slate-800">{score}</span>
                                        <span className="text-slate-500 block text-sm font-bold mt-1">NILAI AKHIR</span>
                                    </div>
                                </div>

                                {/* Stats */}
                                <div className="flex flex-col gap-4 text-left min-w-[200px]">
                                    <div className="bg-emerald-50 p-4 rounded-2xl flex items-center gap-4">
                                        <div className="p-2 bg-emerald-100 text-emerald-600 rounded-lg"><Icons.CheckCircle /></div>
                                        <div>
                                            <div className="text-2xl font-bold text-emerald-700">{correctCount}</div>
                                            <div className="text-sm font-medium text-emerald-600">Jawaban Benar</div>
                                        </div>
                                    </div>
                                    <div className="bg-rose-50 p-4 rounded-2xl flex items-center gap-4">
                                        <div className="p-2 bg-rose-100 text-rose-600 rounded-lg"><Icons.XCircle /></div>
                                        <div>
                                            <div className="text-2xl font-bold text-rose-700">{wrongCount}</div>
                                            <div className="text-sm font-medium text-rose-600">Jawaban Salah</div>
                                        </div>
                                    </div>
                                    <div className="bg-slate-100 p-4 rounded-2xl flex items-center gap-4">
                                        <div className="p-2 bg-slate-200 text-slate-600 rounded-lg"><Icons.Clock /></div>
                                        <div>
                                            <div className="text-2xl font-bold text-slate-700">{emptyCount}</div>
                                            <div className="text-sm font-medium text-slate-500">Tidak Dijawab</div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <button 
                                onClick={onRestart}
                                className="mt-8 px-8 py-3 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-xl shadow-lg transition-colors inline-flex items-center gap-2"
                            >
                                Kembali ke Menu Utama
                            </button>
                        </div>

                        {/* Discussion List */}
                        <div className="space-y-6">
                            <h2 className="text-2xl font-bold text-slate-800 mb-6 pl-2 border-l-4 border-brand-500">Pembahasan Soal</h2>
                            
                            {questions.map((q, idx) => {
                                const userAnswer = answers[idx];
                                const isCorrect = userAnswer === q.correct;
                                const isUnanswered = userAnswer === undefined;

                                return (
                                    <div key={idx} className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                        <div className="p-6 border-b border-slate-100">
                                            <div className="flex items-center gap-3 mb-4">
                                                <span className="bg-slate-100 text-slate-700 font-bold px-3 py-1 rounded-lg text-sm">
                                                    Soal No. {idx + 1}
                                                </span>
                                                {isCorrect && <span className="text-emerald-600 font-bold text-sm flex items-center gap-1"><Icons.CheckCircle /> Benar</span>}
                                                {!isCorrect && !isUnanswered && <span className="text-rose-600 font-bold text-sm flex items-center gap-1"><Icons.XCircle /> Salah</span>}
                                                {isUnanswered && <span className="text-slate-400 font-bold text-sm flex items-center gap-1">Kosong</span>}
                                            </div>
                                            <p className="text-slate-800 font-medium leading-relaxed mb-6">{q.q}</p>
                                            
                                            <div className="space-y-2">
                                                {q.options.map((opt, optIdx) => {
                                                    const isThisCorrect = optIdx === q.correct;
                                                    const isThisUserAns = optIdx === userAnswer;
                                                    
                                                    let rowClass = "p-3 rounded-xl border text-sm flex gap-3 ";
                                                    if (isThisCorrect) {
                                                        rowClass += "bg-emerald-50 border-emerald-200 text-emerald-800 font-semibold";
                                                    } else if (isThisUserAns && !isCorrect) {
                                                        rowClass += "bg-rose-50 border-rose-200 text-rose-800";
                                                    } else {
                                                        rowClass += "bg-slate-50 border-slate-100 text-slate-600";
                                                    }

                                                    return (
                                                        <div key={optIdx} className={rowClass}>
                                                            <div className="w-5 font-bold">{String.fromCharCode(65 + optIdx)}.</div>
                                                            <div className="flex-1">{opt}</div>
                                                            {isThisCorrect && <div className="text-emerald-600"><Icons.CheckCircle /></div>}
                                                            {isThisUserAns && !isCorrect && <div className="text-rose-600"><Icons.XCircle /></div>}
                                                        </div>
                                                    )
                                                })}
                                            </div>
                                        </div>
                                        
                                        {/* Explanation Box */}
                                        <div className="p-6 bg-brand-50 border-t border-brand-100">
                                            <h4 className="font-bold text-brand-800 mb-2 flex items-center gap-2">
                                                <Icons.BookOpen /> Pembahasan:
                                            </h4>
                                            <p className="text-brand-900 text-sm leading-relaxed whitespace-pre-line">
                                                {q.explanation}
                                            </p>
                                        </div>
                                    </div>
                                )
                            })}
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [step, setStep] = useState('GATE'); // GATE, SELECT, EXAM, RESULT
            const [examConfig, setExamConfig] = useState(null); // { type, questions, timeMinutes }
            const [examResult, setExamResult] = useState(null); // { questions, answers }

            const handleUnlock = () => {
                setStep('SELECT');
            };

            const handleSelectProgram = (config) => {
                setExamConfig(config);
                setStep('EXAM');
            };

            const handleFinishExam = (questions, answers) => {
                setExamResult({ questions, answers });
                setStep('RESULT');
            };

            const handleRestart = () => {
                setExamConfig(null);
                setExamResult(null);
                setStep('SELECT');
            };

            return (
                <div className="font-sans text-slate-800 antialiased selection:bg-brand-200 selection:text-brand-900">
                    {step === 'GATE' && <Gatekeeper onUnlock={handleUnlock} />}
                    {step === 'SELECT' && <ProgramSelection onSelect={handleSelectProgram} />}
                    {step === 'EXAM' && examConfig && <CBTEngine config={examConfig} onFinish={handleFinishExam} />}
                    {step === 'RESULT' && examResult && (
                        <ResultScreen 
                            questions={examResult.questions} 
                            answers={examResult.answers} 
                            config={examConfig}
                            onRestart={handleRestart}
                        />
                    )}
                </div>
            );
        };

        // Render App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
