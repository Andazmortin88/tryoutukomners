          { id: 68, rumpun: "Maternitas", text: "Ibu Hamil hiperemesis gravidarum (muntah berlebihan) datang lemas, turgor kulit buruk. Terdapat bau aseton pada mulut. Hasil Lab urin positif zat apa?", options: ["Protein", "Glukosa", "Keton", "Leukosit", "Bilirubin"], correctAnswer: 2, explanation: "Rasional: Hiperemesis Gravidarum (muntah ngidam kehamilan parah tak masuk nutrisi makan minum) menyebabkan tubuh ibu deplesi kelaparan cadangan karbohidrat gula tubuh habis. Untuk energi sel, liver membongkar bakar cadangan lemak ekstrem. Hasil pemecahan bakar lemak (lipolisis darurat) menghasilkan ampas buangan racun 'ZAT KETON' dalam darah, baunya keluar di napas mulut kecut apel/aseton, dan meracuni kencing keluar KETONURIA (+ positif) di Lab.\n\nAnalisis Pilihan Lain:\n• Protein: Protein urin (+) menandakan kerusakan filter glomerulus ginjal ibu (Preeklamsia hamil darah tinggi tensi pecah), bukan hiperemesis kelaparan lemak.\n• Glukosa: Glukosuria (+) urin gula manis menandakan sakit Diabetes Mellitus Gestasional hamil.\n• Leukosit: Leukosit kencing tinggi (+) darah putih ginjal menandakan ibu Infeksi Saluran Kemih (ISK) bakteri bernanah.\n• Bilirubin: Bilirubinuria (+) urin teh pekat menandakan ibu radang kuning Hepatitis gangguan Liver parah." },
          { id: 69, rumpun: "Maternitas", text: "Perempuan primigravida 16 minggu. Tanda pasti kehamilan (Positive sign) yang bisa didapatkan oleh pemeriksa?", options: ["Terdengar Denyut Jantung Janin (DJJ) dengan Doppler", "Tes pack urin positif", "Ibu merasa mual muntah pagi hari", "Teraba ballotement", "Ibu merasakan gerakan janin (Quickening)"], correctAnswer: 0, explanation: "Rasional: Dalam diagnosa maternitas, Tanda Pasti Kehamilan (Positive/Absolute Sign 100% Valid hamil ada bayi) HANYA ADA TIGA: 1. Melihat langsung rangka/jantung janin di alat USG. 2. Teraba bagian tubuh ekstremitas janin secara objektif rabaan kuat dokter/bidan. 3. Terdengar objektif irama Detak Jantung Janin (DJJ) bayi memakai alat Doppler medis bising usus.\n\nAnalisis Pilihan Lain:\n• Tes pack (HCG Urine): Tanda MUNGKIN hamil (Probable Sign), bisa salah positif palsu akibat tumor rahim mola/kanker mola hidatidosa hormon tinggi palsu padahal tak ada bayi.\n• Mual muntah: Tanda TIDAK PASTI hamil (Presumptive Sign), hanya keluhan subjektif, orang telat makan sakit maag masuk angin juga mual.\n• Teraba ballotement (pantulan lenting perut): Tanda MUNGKIN Hamil (Probable Sign), bisa jadi tumor fibroid miom perut yang ngglundung melenting dipantulkan, belum tentu bayi janin.\n• Ibu rasakan gerakan (Quickening): Tanda TIDAK PASTI (Presumptive Subjective), kadang cuma usus ibu kentut kembung kedutan dikira bayi gerak tendang (Pseudocyesis/Hamil Palsu Halu)." },
          { id: 70, rumpun: "Maternitas", text: "Tujuan utama pemeriksaan Leopold 3 pada ibu hamil trimester 3?", options: ["Menentukan TFU", "Menentukan letak punggung janin", "Menentukan bagian terbawah janin (presentasi)", "Menentukan sejauh mana kepala masuk panggul", "Mengetahui denyut jantung janin"], correctAnswer: 2, explanation: "Rasional: Pemeriksaan Rabaan Perut (Leopold Manuver Bidan 1-4) memiliki tujuan baku berurutan. Leopold 3 meraba perut bagian bawah kemaluan simpisis (dengan formasi rabaan capit C terbalik dari ibu jari jari lain) bertujuan mutlak mengetahui PRESENTASI TERBAWAH janin pintu lahir (apakah meraba tulang bulat keras alias presentasi kepala bayi normal, atau meraba empuk tak beraturan besar alias presentasi bokong bayi sungsang).\n\nAnalisis Pilihan Lain:\n• Menentukan TFU (Tinggi Fundus Atas): Tujuan meraba rabaan Leopold 1.\n• Letak punggung pinggir perut bayi: Tujuan rabaan Leopold 2 (tangan sisi membedakan punggung keras papan vs kaki tangan empuk kecil).\n• Sejauh mana kepala masuk ngunci panggul (Divergen/Konvergen): Tujuan rabaan Leopold 4 (Perawat menghadap kaki ibu tekan pelvis dalam panggul jari tembus PAP).\n• Mengetahui DJJ: Telinga Doppler pendengaran auskultasi setelah selesai meraba punggung Leopold 2 di pungtum maksimum bayi, bukan meraba raba tangan raba." },

          // --- JIWA (71-85) ---
          { id: 71, rumpun: "Jiwa", text: "Pasien jiwa 30 tahun sering bicara sendiri, tersenyum sendiri, dan menyendiri di sudut ruang. Masalah keperawatan utama?", options: ["Isolasi sosial", "Halusinasi", "Harga Diri Rendah", "Waham kebesaran", "Risiko Perilaku Kekerasan"], correctAnswer: 1, explanation: "Rasional: Keluhan 'Bicara sendiri, tersenyum tertawa nyengir sendiri padahal tidak ada stimulus teman nyata (ketiadaan stimulus sensorik visual/audio objektif)' adalah data patognomonik objektif perawat yang mengarah 100% pada diagnosa Halusinasi (Palsu sensorik pancaindra), khususnya jenis auditori mendengar bisikan jin teman gaib.\n\nAnalisis Pilihan Lain:\n• Isolasi Sosial: Tanda utamanya adalah mengurung diri diam menunduk apatis tidak menatap mata, BUKAN sibuk interaksi nyengir bicara sendiri mulut beraktivitas.\n• Harga Diri Rendah (HDR): Fokus keluhan pada rasa putus asa, merasa bodoh, gagal, jelek pesimis mengurung diri malu dikritik orang, bukan asyik berinteraksi dengan makhluk tak kasat mata.\n• Waham Kebesaran: Data khasnya bercerita sombong klaim palsu bergelar nabi konglomerat meyakini diri presiden titisan dewa nyata verbal maksa.\n• Perilaku Kekerasan: Gejala khasnya mondar-mandir agresif, mata melotot merah tegang tangan mengepal lempar barang mengamuk pukul marah, bukan diam sudut tersenyum asyik senyum senyum." },
          { id: 72, rumpun: "Jiwa", text: "Tindakan keperawatan Strategi Pelaksanaan (SP) 1 pada pasien dengan Halusinasi?", options: ["Melatih berbincang dengan orang lain", "Melatih minum obat teratur", "Membantu pasien mengenal halusinasi dan cara menghardik", "Membuat jadwal kegiatan harian", "Memvalidasi waham pasien"], correctAnswer: 2, explanation: "Rasional: Dalam Standar Asuhan Keperawatan (SAK Jiwa) SAK Nasional SP1 Halusinasi pasien baru, langkah komunikasi PERTAMA mutlak adalah: (1) Mengidentifikasi bantu sadar halusinasi (waktu isi suara datang, frekuensi respon), lalu disusul (2) Mengajarkan Latihan Cara mengontrol suara paling instan pertama kali: Cara MENGHARDIK (Tutup kuping teriak 'Pergi kamu suara palsu!').\n\nAnalisis Pilihan Lain:\n• Melatih berbincang dgn orang lain: Ini merupakan langkah lanjut SP 3 Pasien Halusinasi (ngobrol menyibukkan diri mengabaikan suara).\n• Melatih minum obat teratur (6 Benar obat): Ini merupakan langkah lanjut materi edukasi SP 2 Pasien Halusinasi.\n• Melakukan Jadwal Kegiatan Harian (Terjadwal padat): Ini merupakan materi SAK langkah SP 4 Pasien Halusinasi agar tak melamun.\n• Memvalidasi waham: Salah diagnosa fokus terapi. Ini untuk pasien penyakit meyakini kepalsuan (Waham SP1 validasi kemampuan realistis), bukan pasien halusinasi mendengar melihat sensor suara (SP Halusinasi)." },
          { id: 73, rumpun: "Jiwa", text: "Pasien marah-marah, membanting barang, dan memukul perawat karena merasa makanannya beracun. Tindakan prioritas?", options: ["Ajarkan tarik napas dalam", "Ajarkan pukul bantal", "Beri obat penenang oral", "Lakukan restrain/fiksasi mekanik atau isolasi (Seclusion)", "Ajak komunikasi terapeutik mendalam"], correctAnswer: 3, explanation: "Rasional: Pasien sedang dalam fase Perilaku Kekerasan AKTIF (Sedang aktual membanting mukul mencederai fisik perawat/diri membahayakan jiwa). Prioritas tertinggi dalam asuhan psikiatri gawat darurat (Safety/Aman) saat pasien ngamuk agresif luar kontrol adalah mengendalikan keselamatan lingkungan paksa: Segera Fiksasi Ikat Tangan Kaki (Restrain fisik mekanis/Seclusion ruang isolasi) beramai 4-5 perawat menindih protap.\n\nAnalisis Pilihan Lain:\n• Tarik Napas Dalam: Mustahil dilakukan. SP 1 ini HANYA diajarkan pada saat pasien marah sudah tenang fase peredaan mau ngobrol duduk, bukan saat lagi mukul piring terbang melayang mengamuk brutal aktual.\n• Pukul bantal/kasur (Penyaluran energi SAK 2): Sama seperti SP1 napas dalam, tidak bisa dipakai mempraktikkan terapi disaat pasien buta mata amuk memukul manusia perawat bukan mukul kasur.\n• Penenang oral (minum pil pil psikotik): Mustahil meminumkan obat manis pelan pelan oral sirup di mulut orang yang menolak meronta berontak mukul curiga racun obat SAK.\n• Komunikasi terapeutik mendalam: Ngobrol basa-basi terapeutik SP pada pasien akut ngamuk itu fatal, perawat bisa babak belur dibunuh dilempar meja. Safety first." },
          { id: 74, rumpun: "Jiwa", text: "Pasien Isolasi Sosial, tampak menunduk, tidak mau keluar kamar, tidak menatap mata saat diajak bicara. SP 1 untuk pasien Isos?", options: ["Bina hubungan saling percaya, latih berkenalan 1 orang", "Latih berkenalan 2 orang", "Latih cara merapikan tempat tidur", "Berikan ECT", "Libatkan dalam Terapi Aktivitas Kelompok (TAK) besar"], correctAnswer: 0, explanation: "Rasional: Pada pasien defisit interaksi menarik diri parah (Isolasi Sosial akut apatis kaku), Strategi Pelaksanaan (SP 1) pertama di hari pertama setelah membina saling percaya identifikasi akar mengurung, adalah Melatih tahapan interaksi sosial paling dasar termudah bayi: Cara Berkenalan dengan SATU (1) orang saja (si Perawat sendiri) menjulurkan tangan, menyebut nama hobi, berani natap mata pelan.\n\nAnalisis Pilihan Lain:\n• Latih berkenalan 2 orang/lebih teman: Ini adalah tahap naik level terapi SAK SP 2 (hari kedua) pasca pasien lulus berani kenalan 1 orang perawat (SP1).\n• Cara merapikan bed/kamar: Ini merupakan fokus tindakan SP dari Diagnosa SAK Harga Diri Rendah (HDR), bukan asuhan penarik diri Isolasi bergaul.\n• ECT (Terapi Kejut Listrik): Terapi kolaborasi medis somatik berat untuk pasien Depresi Suisidal berat membisu bunuh diri membatu (kataton), bukan intervensi standar mandiri SAK perawat di hari pertama.\n• Libatkan TAK Besar langsung kerumunan: SANGAT SALAH. Menceburkan pasien Isos akut langsung ke tengah kerumunan TAK besar pasien RSJ ramai bising hanya akan membuat pasien syok panik cemas dan makin lari trauma mengunci lemari pojokan." },
          { id: 75, rumpun: "Jiwa", text: "Pasien perempuan 25 th pasca kecelakaan kehilangan kaki kanannya. Pasien berkata 'Saya tidak berguna lagi, masa depan saya hancur'. Fase kehilangan (Kubler-Ross)?", options: ["Denial (Penyangkalan)", "Anger (Marah)", "Bargaining (Tawar-menawar)", "Depression (Depresi)", "Acceptance (Penerimaan)"], correctAnswer: 3, explanation: "Rasional: Pernyataan verbal putus asa murni ('tidak berguna, masa depan hancur, saya mau mati saja buat apa hidup buntung') adalah tanda psikologis pesimistis pasif kesedihan klinis, yang merujuk sempurna pada Fase Depresi dalam proses kedukaan kehilangan teori Elisabeth Kubler-Ross (D-A-B-D-A).\n\nAnalisis Pilihan Lain:\n• Denial (Penyangkalan): Reaksi menolak awal kebenaran, ciri kalimat: 'Tidak mungkin kaki saya diamputasi dokter! Kemarin masih bisa jalan lari! Liat tuh kaki saya utuh!'\n• Anger (Marah): Reaksi emosi agresif cari kambing hitam menyalahkan Tuhan/Dokter, ciri: 'Kenapa harus saya Tuhan?! Dokter RS ini bodoh tak bisa menyelamatkan rem kaki saya!'\n• Bargaining (Tawar menawar tuhan): Reaksi janji spiritual memohon kembali mukjizat, ciri kalimat: 'Ya Tuhan, andai kaki saya kembali numbuh, saya janji sumbang semua uang saya ke panti sedekah miskin selamanya.'\n• Acceptance (Menerima ikhlas): Reaksi damai realistis melanjutkan hidup rencana adaptasi baru, ciri kalimat: 'Ya sudah lah saya buntung, saya harus mulai pesan kursi roda palsu dan belajar latihan berjalan mandiri terapi'." },
          { id: 76, rumpun: "Jiwa", text: "Seorang pasien meyakini dirinya adalah utusan nabi yang turun dari langit untuk menyelamatkan RS. Pasien terus mengulang cerita tersebut. Keyakinan pasien ini disebut?", options: ["Halusinasi", "Waham Kebesaran (Megalomania)", "Waham Agama", "Ilusi", "Delirium"], correctAnswer: 1, explanation: "Rasional: Keyakinan palsu yang sangat tidak masuk akal kenyataan, tapi terus dipertahankan teguh kaku (fixed false belief) tentang dirinya yang memiliki status, kekuasaan, pangkat suci, atau kekuatan ajaib hebat luar biasa berlebihan tak realistis (aku Presiden bumi, titisan dewa ratu laut, nabi utusan RS pencipta alam) disebut jenis Waham Kebesaran (Grandiose Delusion / Megalomania Psikotik).\n\nAnalisis Pilihan Lain:\n• Halusinasi: Ini gangguan sensorik panca indera palsu (Mendengar melihat bayangan hantu suara bisik tapi aslinya kosong ga ada orang di ruangan).\n• Waham Agama (Religius): Merasa berdosa dikutuk azab allah dihukum roh gila kitab suci, tapi bedanya dengan Waham Kebesaran adalah di soal ini dia spesifik menonjolkan klaim KEKUASAAN STATUS 'nabi' spesifik pangkat suci, bukan sekadar komat kamit berdosa ibadah aneh (meski mirip irisannya, klasifikasi klaim kekuatan super/pangkat tinggi adalah Megalomania).\n• Ilusi: Gangguan mis-interpretasi ada barang aslinya nyata. (Melihat sapu dikira hantu ular berbisa). Ada objek nyata tapi disalahartikan sensorik otak.\n• Delirium: Gangguan penurunan kesadaran kebingungan bingung organik medis ICU pasca trauma keputihan otak." },
          { id: 77, rumpun: "Jiwa", text: "Prinsip komunikasi terapeutik dalam merespon Waham pasien?", options: ["Mendebat keyakinan pasien", "Menyetujui waham pasien agar tenang", "Fokus pada perasaan pasien tanpa menyetujui wahamnya", "Mengabaikan pasien", "Menertawakan klaim pasien"], correctAnswer: 2, explanation: "Rasional: Prinsip SAK emas menghadapi orang Waham/Gila status ilusi palsu (Delusion). Perawat DILARANG MENGHAKIMI DEBAT karena pasien gila akan defensif emosi memusuhi perawat musuh konspirasi, dan DILARANG MENYETUJUI IKUT GILA KARENA mendukung kebohongan RS sesat. Sikap netral Netral Terapeutik adalah (Presenting Reality) Validasi Perasaan Empati: 'Saya percaya Bapak merasa jadi Nabi utusan sorga, TAPI saya sendiri perawat melihat bapak hanyalah manusia pak Budi biasa.' (Tolak isi waham tanpa menyerang perasaannya).\n\nAnalisis Pilihan Lain:\n• Mendebat agresif logika: Waham adalah kepalsuan rigid keras kepala. Didebat fisika bahwa 'Bapak gila ga mungkin nabi terbang', pasien waham akan marah mengamuk menendang kursi menolak bantahan.\n• Menyetujui kebohongan (Ikut pura-pura gila waham): MELANGGAR KODE ETIK kejujuran asuhan. Perawat dilarang pura-pura hormat sujud pada pasien waham Nabi demi membujuk agar tenang minum obat, ini justru memperkuat (reinforcement) halusinasinya semakin parah menetap otak permanen.\n• Mengabaikan/Menertawakan pasien: Pelanggaran etika empati perawat kasar." },
          { id: 78, rumpun: "Jiwa", text: "Pasien Defisit Perawatan Diri (DPD) dengan badan bau, rambut gimbal, kuku panjang kotor. SP 1 untuk pasien DPD?", options: ["Bantu pasien dandan/berhias", "Bantu pasien makan", "Jelaskan pentingnya kebersihan dan latih cara mandi/cuci rambut/potong kuku", "Latih cara BAB/BAK benar", "Berikan pujian"], correctAnswer: 2, explanation: "Rasional: Standar Asuhan Keperawatan Diagnosa Defisit Perawatan Diri (DPD SAK). Langkah pertama evaluasi membongkar kemalasan kotor (Strategi Pelaksanaan SP1) selalu berfokus kaji pada kebersihan seluruh inti tubuh (Personal Hygiene Mandi Sabunan Keramas Rambut Gimbal Kutu, Potong kuku kaki kotor hitam). Mengajarkan pentingnya alat mandi adalah prioritas hari pertama SAK.\n\nAnalisis Pilihan Lain:\n• Bantu dandan berdandan sisiran lipstik bedak: Ini adalah langkah terapi lanjutan SAK SP 2 Defisit Perawatan Diri, dilakukan besoknya SETELAH si pasien berhasil lulus lulus praktik mandinya di SP1 bersih tubuhnya dulu.\n• Bantu makan minum meja alat bersih rapi (Edukasi Eating): Ini merupakan materi pelatihan lanjut SAK SP 3 DPD.\n• Latih cara BAB/BAK masuk kloset guyur bersih siram Toilet (Toileting): Ini adalah pelatihan tahapan SAK SP 4 DPD akhir pembuangan ekskresi.\n• Berikan pujian: Ini adalah teknik prinsip pendukung di semua SP reinforcement positif." },
          { id: 79, rumpun: "Jiwa", text: "Pasien HDR (Harga Diri Rendah) merasa bodoh karena selalu gagal tes CPNS 5x. Intervensi SP 1 yang membangun kepercayaan diri?", options: ["Beri tugas berat agar merasa tertantang", "Fokus pada kelemahan agar ia sadar", "Identifikasi kemampuan positif yang masih dimiliki dan latih salah satunya", "Suruh pasien istirahat total", "Suruh ikut kursus intensif"], correctAnswer: 2, explanation: "Rasional: Konsep inti asuhan keperawatan mental penderita Harga Diri Rendah Kronis (HDR) adalah Menggali Potensi positif tersisa yang tenggelam. Strategi SP 1 pertama kali wajib membongkar mindset pesimis kegagalan: (1) Mengidentifikasi membuat daftar hal-hal keahlian aspek positif yang masih pasien bisa lakukan ringan berprestasi (misal ahli menyapu taman, pandai menggambar, masak nasi uduk lipat baju rapi), dan (2) MELATIH 1 KEMAMPUAN kecil ringan positif itu langsung hari itu juga untuk menciptakan letupan pujian sukses kecil pengangkat pedoman self-esteem jatidiri harga dirinya naik perlahan berharga kembali hidupnya.\n\nAnalisis Pilihan Lain:\n• Beri tantangan tugas berat kompleks: SANGAT DILARANG FATAL! Pasien HDR punya mental kaca pecah. Jika diberi tugas ujian tes gagal lagi, ia akan makin depresi bunuh diri hancur mental akut frustasi beban.\n• Fokus titik berat pada kelemahan evaluasi sadar bodoh: Makin menghancurkan percaya diri hancur lebur diremehkan perawat.\n• Istirahat total rebahan kamar merenung: Memperparah diam apatis overthinking rasa gagal HDR pikiran pesimis.\n• Kursus intensif: Menambah stres kognitif beban CPNS traumanya belum siap mental belajar berat bangkit." },
          { id: 80, rumpun: "Jiwa", text: "Pasien depresi berat ditemukan menyimpan tali tambang di bawah kasur. Saat dikaji, ia menjawab 'Semua akan lebih baik jika saya tidak ada'. Tindakan segera?", options: ["Eksplorasi alasan pasien", "Lapor polisi", "Berikan anti-depresan oral", "Jauhkan barang berbahaya dan lakukan observasi ketat 1:1", "Ikat tangan dan kaki pasien ke kasur"], correctAnswer: 3, explanation: "Rasional: Pernyataan pasrah mengakhiri eksistensi jiwa ditambah temuan objektif ALAT BUKTI (Tali Tambang gantung diri disembunyikan kasur) adalah Indikasi Gawat Darurat Mutlak Psikiatri: Ancaman RISIKO BUNUH DIRI AKTIF mengancam nyawa hitungan detik. Prinsip kegawatdaruratan mutlak (SAFETY FIRST) adalah Mengamankan menjauhkan seluruh benda alat berbahaya maut, dan WAJIB melakukan isolasi Observasi Konstan Mata ke Mata (1 perawat mantau terus menerus 1 pasien 24 jam nonstop tak sedetikpun lengah ke toilet) mencegah tindakan impulsif tiba-tiba bunuh diri di kamar mandi loncat gedung.\n\nAnalisis Pilihan Lain:\n• Eksplorasi komunikasi wawancara alasan mati: Buang waktu darurat. Tindakan mengamankan alat eksekusi mati tali tambangnya harus duluan direbut fisik baru wawancara.\n• Lapor polisi hukum: Pasien jiwa medis dirawat RSJ medis keperawatan medis, bukan kriminal kriminalitas polisi interogasi masuk penjara pidana membahayakan psikis.\n• Beri antidepresan obat oral: Pil butuh waku berminggu minggu agar efek kimia serotonin otaknya naik bahagia, ga bisa instan stop niat gantung diri detik ini tali maut di kasur.\n• Ikat tangan kaki (Fiksasi Restrain mekanik total): Tidak manusiawi dan melanggar etik. Restrain fiksasi ranjang HANYA jika ia mulai agresif fisik ngamuk brontak berontak membahayakan memukul menusuk, BUKAN untuk pasien depresi merenung diam bunuh diri." },
          { id: 81, rumpun: "Jiwa", text: "Tanda objektif pasien Ansietas Berat (Kecemasan Berat)?", options: ["Lapang pandang luas", "Mampu belajar hal baru", "Fokus pada satu detail spesifik (menyempit), tidak bisa diajak bicara rasional", "Tidur nyenyak", "Bisa memecahkan masalah kompleks"], correctAnswer: 2, explanation: "Rasional: Klasifikasi Kecemasan (Ansietas) dibagi level. Pada level Ansietas BERAT (Severe Anxiety), lapang pandang persepsi kognitif pasien menjadi SANGAT SEMPIT menyempit mengerucut hanya pada objek kecemasan fokus satu detail spesifik ketakutannya mengunci, dan kemampuan menyerap edukasi instruksi rasional dari perawat tertutup total lumpuh (tidak bisa menerima informasi nasehat logis baru dibicarakan).\n\nAnalisis Pilihan Lain:\n• Lapang pandang persepsi masih luas detail waspada: Ini adalah ciri khas Ansietas RINGAN (Mild Anxiety) waspada awas lingkungan sehat.\n• Mampu belajar menangkap fokus hal informasi baru instruksi nasehat dari perawat: Ini adalah batas kemampuan Ansietas SEDANG (Moderate) dibimbing.\n• Tidur nyenyak relax santai biologis damai normal koping: Tidak terjadi pada orang yang sedang cemas berat syok keringat dingin.\n• Memecahkan masalah rumit logis problem solving kuat akurat: Sama ciri Ansietas normal waspada ringan ringan." },
          { id: 82, rumpun: "Jiwa", text: "Pasien Skizofrenia menolak minum obat Chlorpromazine karena takut diracun. Sikap perawat?", options: ["Memaksa buka mulut pasien", "Mencampur obat diam-diam ke dalam teh", "Tanya alasannya dan edukasi manfaat obat (Prinsip Veracity & Autonomy)", "Lapor dokter untuk injeksi paksa", "Membiarkan pasien tidak minum obat selamanya"], correctAnswer: 2, explanation: "Rasional: Prinsip dasar keperawatan etik otonomi pasien sadar. Pasien menolak obat karena delusi waham curiga wajar SAK, perawat tak boleh otoriter. Sikap ideal terapeutik pertama adalah mengeksplorasi menggali tanya mendengarkan keluhan takutnya ('Oh bapak takut racun ya pak?'), kemudian memvalidasi empati dan menjelaskan prinsip (Veracity kejujuran) fungsi obat penenang agar bisa tidur santai manfaat edukasi rasional perlahan membangun Trust, BUKAN maksa kekerasan fisik hari itu juga minum.\n\nAnalisis Pilihan Lain:\n• Maksa buka rahang mulut kekerasan cekok tangan paksa telan: Pelanggaran Etik kekerasan fisik batery penganiayaan HAM pasien.\n• Mencampur diam-diam di teh minuman manis sirup tanpa bilang (Sabotase terapi): SANGAT MELANGGAR ETIK KEJUJURAN (Veracity). Jika pasien sadar tau tehnya pahit direkayasa suster, ia akan ngamuk hancur trust meyakini perawat benar-benar agen FBI peracun mau bunuh dia waham makin parah curiga.\n• Lapor injeksi suntik paksa bokong IM bius: Tindakan medis kolaborasi terakhir jika pasien membahayakan ngamuk banting pintu gawat darurat, tapi kalau cuma pasif nutup mulut nolak pil edukasi lisan harus ditempuh bujuk perlahan.\n• Membiarkan tak minum obat selamanya: Kelalaian medis fatal menelantarkan asuhan medis kesembuhan." },
          { id: 83, rumpun: "Jiwa", text: "Pasien mondar-mandir tegang, tangan mengepal, mata melotot. Tanda dari?", options: ["Isolasi Sosial", "Risiko Perilaku Kekerasan", "Waham curiga", "Ansietas ringan", "Depresi agitated"], correctAnswer: 1, explanation: "Rasional: Data objektif observasi postur tubuh kinesik: Rahang mengatup kaku, Mondar-mandir gelisah memuncak (Pacing asidosis agresif), Tangan mengepal kuat urat keluar, dan Pandangan mata tajam melotot sinis, adalah gejala fase transisi peringatan Tanda Peringatan Dini (Warning sign / Pre-assaultive) mutlak dari pasien Risiko murni meledaknya Perilaku Kekerasan memukul menyerang merusak benda.\n\nAnalisis Pilihan Lain:\n• Isolasi Sosial: Tanda tubuhnya lemas apatis loyo lesu mengurung selimut bantal kasur pojok menunduk menolak tatap mata kusam tidak rapih (berkebalikan melotot amuk PK).\n• Waham Curiga: Mungkin ia curiga di otaknya berprasangka intel fbi, namun yang TAMPAK LUAR manifes gesturnya mengepal banting itu adalah Risiko PK.\n• Ansietas Ringan: Masih tenang kooperatif waspada sehat ngobrol edukasi masuk nyambung santai, bukan mengepal tegang agresif mengamuk mata merah melotot galak.\n• Depresi agitated: Gejala psikiatri sedih merenung namun gelisah meremas jari menangis mondar mandir merengek minta mati sedih menderita (bukan mengancam memukul agresif membanting meja marah kaku kepal)." },
          { id: 84, rumpun: "Jiwa", text: "Kegiatan Terapi Aktivitas Kelompok (TAK) Sosialisasi Sesi 1 bertujuan untuk?", options: ["Menyampaikan pendapat", "Bekerjasama dalam permainan", "Memperkenalkan diri (Nama, panggilan, hobi)", "Menyelesaikan masalah kelompok", "Mengingat masa lalu"], correctAnswer: 2, explanation: "Rasional: Dalam Standar baku Modul Nasional TAK (Terapi Aktivitas Kelompok) Sosialisasi. Sesi Paling Awal Pertama (Sesi 1 TAKs) fokusnya adalah pondasi interaksi komunikasi membuka gerbang gaul: Kemampuan dasar Mengenalkan Diri Sendiri Identitas ke audiens grup (Menyebut Nama lengkap asli, Nama sapaan kesukaan dicintai, dan Hobi kesenangan positif minat).\n\nAnalisis Pilihan Lain:\n• Sesi Menyampaikan berpendapat berdiskusi topik bebas mengemukakan argumen debat: Ini adalah tingkat kompleks TAK Sosialisasi Sesi 4 atau 5.\n• Sesi Bekerjasama kelompok kompetisi menendang bola kelompok kekompakan: Ini adalah TAK Sosialisasi game Sesi paling akhir tingkat mahir keramaian bermain bersama kelola emosi Sesi 6/7 akhir tim.\n• Sesi Menyelesaikan mengutarakan problem solving masalah konflik di ruangan bangsal keluhan: TAK Sosialisasi bukan grup curhat curhat masalah keluarga hidup dalam psikologis penyelesaian beban solusi curhat.\n• Sesi Mengingat masa lalu orientasi memori pikun lupa alamat bulan tahun ingatan tanggal lahir jam: Ini adalah TAK khusus Lansia Orientasi Realita (TAK OR lansia pikun dimensia alzheimer amnesia), BUKAN TAK belajar bergaul anak gaul sosialisasi berkenalan kaku gembira asyik." },
          { id: 85, rumpun: "Jiwa", text: "Tanda efek samping ekstrapiramidal (EPS) akibat antipsikotik haloperidol (Haldol)?", options: ["Mulut kering", "Konstipasi", "Kekakuan otot leher/wajah (distonia), tremor, akatisia", "Sedasi berlebih", "Berat badan naik pesat"], correctAnswer: 2, explanation: "Rasional: Obat Psikiatri Antipsikotik Tipikal Generasi Pertama (Seperti Haloperidol/Haldol, Chlorpromazine/CPZ) berisiko memblokir dopamin ekstrim memicu Sindrom Ekstrapiramidal (EPS). Efek samping EPS berfokus pada gangguan KONTROL GERAK OTOT MOTORIK kaku: Distonia Akut (kaku leher melintir, rahang narik, mata mendelik ke atas), Akatisia (Gelisah ekstrem kaki tak bisa diam jalan terus kaya setrikaan goyang goyang), dan Pseudoparkinsonisme (Tremor gemetar tangan melintir pil, kaku berjalan diseret robot).\n\nAnalisis Pilihan Lain:\n• Mulut kering & Konstipasi (Susah BAB keras) & Pandangan kabur: Ini BUKAN EPS motorik, melainkan Efek Samping ANTI-KOLINERGIK sekresi air ludah mampet, efek samping biasa obat jiwa antipsikotik juga (efek samping otonom cairan kelenjar tubuh, bukan saraf otot gerak).\n• Sedasi ngantuk berat lemas tidur terus: Efek Samping menenangkan depresi SSP obat, BUKAN saraf motorik kejang otot (EPS kejang).\n• Berat badan naik pesat drastis obesitas metabolisme (Sindrom Metabolik gula darah naik lemak tinggi DM membesar lipida jahat): Ini adalah khas efek samping maut obat antipsikotik Generasi KEDUA baru Atipikal modern (Clozapine, Olanzapine, Quetiapine), BUKAN Haldol injeksi jadul klasik." },

          // --- KOMUNITAS & GERONTIK (86-94) ---
          { id: 86, rumpun: "Gerontik", text: "Lansia 75 tahun di panti wreda mengeluh sering mengompol saat tertawa atau batuk keras. Jenis inkontinensia urin?", options: ["Inkontinensia fungsional", "Inkontinensia stress", "Inkontinensia urge", "Inkontinensia overflow", "Inkontinensia campuran"], correctAnswer: 1, explanation: "Rasional: Keluarnya cairan urin bocor merembes tak tertahankan HANYA PADA SAAT terjadinya pemicu tekanan dari dalam perut (peningkatan tekanan intra-abdomen mendadak kuat otot menekan kandung kemih) seperti saat mengejan batuk keras, bersin kencang pilek, tertawa ngakak, lompat olahraga, atau mengangkat barang karung berat, secara patofisiologis diklasifikasikan sebagai tipe Stress Incontinence (Inkontinensia Stres karena beban mekanik lemahnya otot dasar panggul panggul kegel perineum).\n\nAnalisis Pilihan Lain:\n• Inkontinensia Fungsional: Urin bocor bukan karena kandung kemih lemah, TAPI karena pasien tak sempat lari ke WC toilet keburu ngompol di jalan (karena patah kaki pincang lumpuh rematik / stroke butuh perawat lama nuntun).\n• Inkontinensia Urge (Desakan Overaktif): Urin bocor ngompol mendadak karena kebelet sangat hebat dadakan tiba-tiba kontraksi detrusor ngamuk tanpa sebab (tiba tiba diam nonton TV tau tau ngucur deras bocor tak bisa tahan katup), bukan karena batuk perut nekan.\n• Inkontinensia Overflow (Luberan Penuh): Ngompol meler bocor sedikit-sedikit terus menerus karena tangki kandung kemih sudah penuh bengkak batu prostat mampet tumpah luber netes netes ga kerasa tumpah banjir menetes celana basah terus.\n• Campuran: Gabungan stress dan urge murni kompleks urodinamik." },
          { id: 87, rumpun: "Gerontik", text: "Perawat melakukan Mini Mental State Exam (MMSE) pada lansia. Perawat meminta lansia mengurangi 100 dengan 7 terus menerus (100, 93, 86...). Aspek apa yang dinilai?", options: ["Orientasi waktu", "Orientasi tempat", "Registrasi memori", "Atensi dan Kalkulasi (Perhatian & Hitungan)", "Bahasa"], correctAnswer: 3, explanation: "Rasional: Instrumen MMSE digunakan untuk mengkaji fungsi kognitif lansia pikun alzheimer dimensia. Soal hitungan berhitung mundur pengurangan angka matematika bertingkat kompleks di otak (Serial 7s : 100-7=93, 93-7=86, dst) ATAU mengeja kata mundur (W A H Y U -> U Y H A W) didesain khusus merangsang lobus frontal untuk menguji Aspek 'Kalkulasi Hitungan Matematika Logika' dan Aspek 'Atensi Fokus Konsentrasi Perhatian Otak' memegang ingatan angka kerja lansia.\n\nAnalisis Pilihan Lain:\n• Orientasi waktu: Pertanyaan aspek kalender (Sekarang tahun berapa mbah? Musim hujan panas? Bulan hari tanggal apa kalender).\n• Orientasi tempat: Pertanyaan aspek geografi alamat (Kita lagi di ruang puskesmas nama apa mbah? Desa RW apa provinsi kecamatan negara mana peta bumi?).\n• Registrasi memori tangkap ulang sebut ulang segera: Perawat nyebut 3 benda (Buku Meja Bola), pasien disuruh langsung mengulang nyebut balik 3 benda detik itu juga pendengaran ingatan masuk.\n• Bahasa naming bahasa benda fungsi tata tulis: Disuruh unjuk jam tangan (Ini benda apa mbah panggilannya?), disuruh turuti perintah 3 tahap kertas lipat taro lantai, disuruh salin tulisan huruf balok gambar jam pentagon." },
          { id: 88, rumpun: "Komunitas", text: "Perawat komunitas mendapati tingginya angka perokok remaja di suatu SMA. Perawat membuat program 'Duta Anti Rokok' dari siswa itu sendiri (Peer Educator). Strategi intervensi ini disebut?", options: ["Pendidikan kesehatan", "Kemitraan (Partnership)", "Pemberdayaan Masyarakat (Empowerment)", "Proses kelompok", "Modifikasi lingkungan"], correctAnswer: 2, explanation: "Rasional: Strategi keperawatan komunitas yang melatih, mendidik, membentuk kader pengurus inti tokoh dari DALAM komunitas itu sendiri (membentuk agen agen siswa teman sebaya Peer Educator penyuluh kader duta promkes) agar kelak mereka mandiri swadaya dari rakyat oleh rakyat mengelola kesehatan menyelesaikan masalah desa wilayahnya menyebar nasehat tanpa perawat terus, adalah hakikat murni konsep Pemberdayaan Masyarakat (Community Empowerment kaderisasi mandiri berkelanjutan akar rumput maju bergerak membina kekuatan sendiri).\n\nAnalisis Pilihan Lain:\n• Pendidikan kesehatan promkes lisan: Hanya penyuluhan pidato ceramah satu arah informasi dari mulut perawat petugas medis seminar leaflet slide membagikan ilmu saja.\n• Kemitraan (Partnership) kolaborasi sektoral: Mengajak pihak luar luar sekolah kerjasama MoU dana (misal perawat ngajak donatur perusahaan rokok, kepolisian, pak camat bupati sponsor bangun WC lapangan bola dana hibah lintas sektoral).\n• Proses kelompok dinamika musyawarah MMD: Pembahasan rapat rembuk bareng rapat solusi grup desa evaluasi curhat masalah (Bukan melatih mandiri eksekutor kader sebaya teknis murni pelaksana turun agen).\n• Modifikasi tata kelola lingkungan fisik nyata: Menanam pohon hijau oksigen sekolah bersih, membuat tong sampah pilah besar plang dilarang asap kawasan bebas rokok pasang rambu peringatan merubah lingkungan." },
          { id: 89, rumpun: "Gerontik", text: "Lansia dengan Demensia Alzheimer sering mondar-mandir (wandering) malam hari dan lupa jalan ke kamar. Intervensi keperawatan modifikasi lingkungan?", options: ["Kunci lansia di dalam kamar", "Pasang lampu sensor gerak dan tempel gambar toilet/kamar tidur di pintu", "Ikat lansia di kursi roda", "Berikan obat tidur dosis tinggi tiap malam", "Suruh lansia hafalkan denah panti"], correctAnswer: 1, explanation: "Rasional: Lansia Demensia kepikunan otak Alzheimer mengalami kelumpuhan kognitif disorientasi ruang kebingungan nyasar rute arah letak lorong. Modifikasi terapi Lingkungan (Milieu Therapy lingkungan aman memori lansia) terbaik tanpa melanggar ham adalah memasang panduan isyarat visual simbolik mencolok non-verbal (gambar kartun WC besar toilet, foto kasur tidur raksasa di pintu kamarnya) memandu otak primitifnya, serta lampu terang otomatis cegah jatuh celaka nyasar keluyuran nabrak tembok gelap malam buta nyasar panti bingung.\n\nAnalisis Pilihan Lain:\n• Kunci kurung dalam kamar gelap sel isolasi hukuman: SANGAT Melanggar etika hak asasi HAM kebebasan bergerak memicu panik ngamuk gedor pintu histeris.\n• Ikat restraining kursi roda lumpuh rantai: SANGAT Melanggar etika kejam lansia tak agresif ngamuk memukul bahaya (hanya bingung lupa jalan kok diikat disiksa badan fisiknya).\n• Obat bius tidur hipnotik sedasi bius penenang tiap malam teler: Bahaya jatuh, mempercepat pikun kimiawi demensia merusak sel otak ginjal hepar beban obat keras lansia geriatri kimia teler kimia farmasi.\n• Hafalkan map hapalan belajar mengingat denah tata ruang rumit paksa memori baru kertas peta denah jalan rute gedung: Mustahil secara otak. Kepikunan Alzheimer merusak hippocampus saraf memori simpanan, otak mereka mustahil menyerap hapalan baru alamat kompleks belok kanan kiri tangga, memaksa hafal bikin lansia gila stres frustrasi marah agresif nangis." },
          { id: 90, rumpun: "Komunitas", text: "Dalam konsep 5 Tingkat Pencegahan (Leavell & Clark), rehabilitasi stroke masuk dalam kategori?", options: ["Health Promotion", "Specific Protection", "Early Diagnosis", "Disability Limitation", "Rehabilitation (Tertiary Prevention)"], correctAnswer: 4, explanation: "Rasional: Teori emas Kesehatan Masyarakat (Leavell & Clark 5 level). Level terakhir kelima (Tertiary Prevention / Pencegahan Tersier) adalah Fase Rehabilitasi. Fokusnya dilakukan PADA SAAT penyakit kritis lumpuh/akut Selesai SEMBUH cacat lumpuh pasca op, bertujuan melatih sisa fungsi cacat tubuh (fisioterapi stroke jalan latihan bicara, kursi roda pasang kaki tangan palsu amputasi cacat, bantu kerja lagi bersosial mandiri masyarakat produktif sisa usia maksimal cegah keparahan cacat abadi menumpang).\n\nAnalisis Pilihan Lain:\n• Health Promotion (Primer level 1 awam): Promosi kesehatan pendidikan senam jantung sehat kampanye anti rokok gizi balita untuk ORANG SEHAT wal afiat 100% bugar bugar.\n• Specific Protection (Primer level 2 spesifik tameng): Perlindungan alat spesifik pencegah cegah spesifik sakit helm sabuk pengaman vaksinasi polio APD masker kacamata las.\n• Early Diagnosis & Prompt Treatment (Sekunder level 3 deteksi dini skrining pengobatan segera ancam maut): Skrining mamografi tumor pap smear, cek gula darah massal gratis pameran, minum obat TBC cepat bunuh kuman cegah menular, operasi tumor angkat cepat IGD.\n• Disability Limitation (Sekunder akhir level 4 stop cacat cegah komplikasi parah amputasi masuk icu gawat): Obat penurun tensi tinggi cegah otak stroke meledak, obat gangren potong jari busuk cegah busuk naik ke betis paha jantung merambat." },
          { id: 91, rumpun: "Komunitas", text: "Data Posyandu Balita menunjukkan 30% balita di garis kuning KMS. Perawat mengadakan lomba masak Makanan Pendamping ASI (MP-ASI) bergizi berbahan lokal. Sasaran primer program ini?", options: ["Balita", "Kader Posyandu", "Ibu balita (Pengasuh utama)", "Kepala Desa", "Puskesmas"], correctAnswer: 2, explanation: "Rasional: Teori Sasaran Promosi Kesehatan Promkes Komunitas. Sasaran Primer adalah target kelompok AKAR utama objek pasien perilaku yang diharapkan MENGUBAH PERILAKU kebiasaan pola hidup hariannya secara LANGSUNG mengeksekusi gizi di rumah sendok meja makan kompor dapur. Dalam kasus asupan nutrisi MP-ASI anak stunting, anak balita tak bisa masak sendiri menasehati diri balita kecil. Maka Eksekutor Pengubah Perilaku utamanya adalah Ibu pengasuh balitanya yg menyuapi belanja milih menu (Sasaran Primer edukasi merubah mindseat gizi langsung dapur).\n\nAnalisis Pilihan Lain:\n• Balita bayi gizi kurang busung lapar stunting kuning KMS: Mereka adalah 'Objek Penderita' yg menikmati hasil masakan (bukan pelaksana masak rubah mindset kognitif lomba cerdas cermat rubah perilaku edukasi pemahaman).\n• Kader Posyandu penggerak desa tokoh: Ini masuk kelompok Sasaran SEKUNDER (Tangan Kanan Bantuan). Mereka mendukung mendorong memfasilitasi si Primer ibu-ibu agar berubah menyebar gosip arisan penyuluh ikut ngasih contoh (Pelantara edukator bantu).\n• Kepala Desa lurah RT RW dana APBD camat bupati birokrasi pembuat izin SK aturan desa: Ini mutlak masuk Sasaran TERSIER (Dukungan Kebijakan dana kekuasaan Aturan denda peraturan pemaksa pelindung top down policy birokrat).\n• Puskesmas Kapus perawat bidan ahli gizi dinas: Instansi Provider penyelenggara inisiator otak pemikir perencana bukan sasaran target rubah kelakuan gizi ibu warga desa awam edukasi KMS kuning." },
          { id: 92, rumpun: "Gerontik", text: "Perubahan fisiologis sistem muskuloskeletal lansia yang paling meningkatkan risiko patah tulang?", options: ["Penurunan massa otot (sarkopenia)", "Kekakuan sendi (osteoartritis)", "Penurunan massa tulang (osteoporosis)", "Penurunan ligamen elastis", "Penebalan tulang rawan"], correctAnswer: 2, explanation: "Rasional: Penurunan massa matriks kalsium kepadatan tulang (Osteoporosis pengeroposan sarang lebah rapuh kopong dalam tulang) adalah perubahan degeneratif fisiologis muskuloskeletal lansia (terutama wanita post-menopause hormon estrogen drop tak ikat kalsium tulang hancur) yang PALING BERKONTRIBUSI MUTLAK meningkatkan risiko patah tulang (Fraktur patologis ringan). Tulang rapuh mudah patah hancur remuk krek hanya gara gara terpeleset kesandung jatuh pelan ringan trauma sepele (Fraktur femur leher panggul collum bungkuk kiposis memendek tinggi badan rapuh).\n\nAnalisis Pilihan Lain:\n• Penurunan massa otot daging mengecil tipis kelemahan (sarkopenia otot ciut tenaga ilang): Bikin lansia loyo tak kuat ngangkat ember capek jalan, tapi bukan tulang murni penyebab langsung tulang patah krek hancur fraktur rapuh kalsium keropos osteoporosis.\n• Kekakuan nyeri bengkak pelumas habis Sendi gesek linu tulang ngilu lutut radang (Osteoartritis rematik tua gesek cairan synovial habis menipis): Bikin lansia jalan pincang linu nyeri bergerak kesakitan kaku pagi susah ditekuk jongkok duduk ruku sholat rematik linu cuaca dingin, BUKAN patah tulangnya.\n• Penurunan ligamen urat elastis kendor keseleo tegang urat tarik tendon kendor (Laxity sendi goyang tendonitis): Risiko terkilir keseleo pergeseran sendi engsel dislokasi melintir bukan fraktur tulang retak keropos hancur kalsiumnya rontok.\n• Penebalan tulang rawan sendi spur jalu ayam taji tulang abnormal osteofit kapur nempel sendi sakit nyeri gesek menonjol jempol: Bikin ngilu nusuk nyeri, bukan bikin patah tulangnya." },
          { id: 93, rumpun: "Komunitas", text: "Perawat melakukan kunjungan (home care) ke pasien TBC. Perawat melihat ventilasi rumah tertutup rapat. Intervensi edukasi lingkungan utama?", options: ["Ajarkan meminum obat rutin OAT", "Anjurkan membuka jendela setiap pagi membiarkan cahaya masuk", "Bakar sampah medis di pekarangan", "Beri makan protein tinggi", "Anjurkan sekeluarga pakai masker 24 jam di dalam rumah"], correctAnswer: 1, explanation: "Rasional: Kuman penyebab Tuberkulosis (Mycobacterium Tuberculosis) sangat rentan dan mati lemas luluh hancur seketika saat dibakar terbakar paparan Sinar Ultraviolet (UV Matahari) luar terik menembus kaca udara. Selain itu, kuman menumpuk di kamar apek udara mandek pekat aerosol bersin batuk batuk dahak racun menular konsentrasi tinggi sesak dihirup cucu keluarga tertular menumpuk. Solusi mutlak Modifikasi Edukasi Lingkungan Fisik pencegah penularan serumah parah adalah (Cross Ventilation) Sirkulasi Angin Udara Silang dan Sinar UV (MEMBUKA JENDELA LEBAR PAGI HARI biar sinar UV bunuh kuman matahari gratis kuman mati kering udara kotor terbang bersih).\n\nAnalisis Pilihan Lain:\n• Ajarkan minum OAT Obat anti tuberkulosis disiplin PMO awasi DOTS telan obat merah pipis: Ini edukasi KEPATUHAN TERAPI BIOKIMIA FARMAKOLOGI sembuh biologis 6 bulan paru. (Yang ditanya soal 'EDUKASI LINGKUNGAN' rumah).\n• Bakar sampah ludah medis buang pot dahak lysol infeksius abu pekarangan rumah api asap polusi debu: Berbahaya mencemari udara sesak nafas iritasi tetangga asma lingkungan rukun tetangga udara kotor jelaga.\n• Beri makan gizi kalori TKTP putih telur ikan sembuh naik bb gizi baik imun naik: Ini edukasi NUTRISI diet makanan sembuh antibodi kuman badan (Yang ditanya soal 'EDUKASI LINGKUNGAN').\n• Anjurkan pakai masker n95 tebal ketat seharian 24 jam di dalam rumah semua orang keluarga sehat pakai: Sangat menyiksa tidak logis napas sesak oksigen kurang hipoksia iritasi pengap gatal wajah panas (Masker dipakai saat kontak tatap bicara langsung erat aja pasien pakai)." },
          { id: 94, rumpun: "Gerontik", text: "Lansia 70 th mengeluh sulit tidur nyenyak, sering bangun tengah malam. Edukasi Sleep Hygiene?", options: ["Minum kopi hangat sebelum tidur", "Tidur siang 4 jam agar segar", "Olahraga berat 1 jam sebelum tidur", "Gunakan kasur hanya untuk tidur (bukan makan/nonton) dan redupkan lampu", "Main handphone sambil tiduran"], correctAnswer: 3, explanation: "Rasional: Konsep pilar manajemen Sleep Hygiene (Kebersihan pola tidur sehat natural non-obat) mengatur ritme sirkadian hormon melatonin otak tidur ngantuk alami sehat. Aturan EMAS utamanya: Redupkan matikan lampu gelap (merangsang melatonin keluar ngantuk mata berat), dan KONDISIKAN ASOSIASI PSIKOLOGIS OTAK (Otak harus hafal: Kasur ranjang itu HANYA tempat merebahkan badan untuk Merem Tidur nyenyak intim, JANGAN pakai kasur buat kerja nyari uang laptop makan seblak nonton sinetron TV bising ngerumpi main HP scroll tiktok ketawa mikir utang).\n\nAnalisis Pilihan Lain:\n• Minum teh kopi coklat hangat sebelum tidur malam seduh panas manis: SALAH FATAL, Kopi teh coklat mengandung Kafein Teofilin perangsang otak melek debar debar takikardia melek melotot segar bugar kencing terus diuretic (bikin lansia bolak balik kencing wc ganggu melek insomnia begadang parah makin tak bisa tidur).\n• Tidur siang molor balas dendam rebahan 4-5 jam siang terik sore nyenyak: SALAH FATAL. Jatah tidur lansia cuma 6 jam 24 jam sehari metabolisme turun lambat tua. Kalau siang udah dihabiskan lunas 4 jam molor deep sleep nyenyak. Nanti malem jam 9 mata bakal melotot melek bugar seger banget sisa jatah tidur habis (Insomnia akut jadwal kacau).\n• Olahraga senam angkat beban berat ngos ngosan lari treadmill 1 jam malam 9 malam sblm tidur keringetan: SALAH FATAL, Olahraga malam naikin pacu jantung detak panas tubuh kortisol adrenalin naik suhu panas membara (Mata melek segar bugar waspada tempur siaga adrenalin jantung debar kencang tak bisa merem nyenyak syok sirkulasi hormon).\n• Main HP Scroll sosmed gadget tiduran layar biru terang pancaran cahaya blue light HP laptop mata tajam ngetik ngetwit baca berita mikir emosi gosip WA grup panas mikir cemas utang judi biru terang: Cahaya Blue Light layar hp mematikan hormon melatonin tidur, mata otak ngira siang hari matahari terbit melek, mikir otak panas aktif." },

          // --- MANAJEMEN & ETIK (95-100) ---
          { id: 95, rumpun: "Manajemen", text: "Kepala ruang ICU selalu mengambil keputusan sendiri tanpa mendengar pendapat perawat pelaksana. Jika ada staf salah, ia marah di depan umum. Gaya kepemimpinan?", options: ["Demokratis", "Otoriter (Autokratik)", "Laissez-faire", "Partisipatif", "Transformasional"], correctAnswer: 1, explanation: "Rasional: Gaya Pemimpin Otokratis (Otoriter Diktator) berpusat pada kekuasaan mutlak dipegang di pucuk satu orang komandan tunggal Karu (Sentralisasi kuasa komando). Ia mendikte perintah wajib dipatuhi instruksi searah menekan ke bawah paksa (Top Down mematikan inovasi bawah), tak butuh tak terima kritikan bawahan rapat tutup telinga, orientasi murni target tugas selesai cepat, motivasi bawahan didorong pake paksaan hukuman ancaman pecat SP marah galak hukuman fisik potong gaji takut (Punishment orientasi disiplin kaku militer kaku arogan).\n\nAnalisis Pilihan Lain:\n• Demokratis (Demokrasi): Sangat ideal kebersamaan merangkul. Karu ajak rapat tim staf curhat rembuk masalah bersama musyawarah denger pendapat staf mufakat adil voting solusi ambil suara terbanyak bersama sama bareng adem terbuka (Bukan marah sendiri egois tak denger).\n• Laissez-Faire (Bebas Lepas Tangan Masa Bodo Santai Cuek): Karu apatis duduk diam maen HP ngopi lepas kendali 100% serahkan tugas anak buah terserah lu lu pada ngurus bangsal semau mau ngatur staf bingung no komando arah kosong kacau balau loss santuy (Bukan ngamuk marah hukuman kaku diktator paksa disiplin).\n• Partisipatif: Mirip demokratis, Karu ngundang keterlibatan staf nanya pendapat andil bawahan menyumbang ide pencerahan sebelum ketuk palu keputusan adil (Bukan nutup telinga ambil sendirian otoriter kaku).\n• Transformasional (Inspiratif merubah jaman motivasi tinggi agen perubahan revolusi agen agen panutan karismatik): Pemimpin hebat luar biasa agen teladan ngerubah mindset staf jadi lebih termotivasi maju sekolah lagi ikut inovasi lomba rs teladan menularkan aura positif panutan contoh teladan pahlawan baik (Bukan tukang marah depan umum ancam hukum SP galak kaku nyuruh otoriter)." },
          { id: 96, rumpun: "Manajemen", text: "Metode Asuhan Keperawatan dimana 1 orang Perawat Ahli (Profesional) dibantu oleh beberapa perawat vokasi untuk merawat sekelompok pasien secara komprehensif disebut metode?", options: ["Metode Kasus", "Metode Fungsional", "Metode Tim", "Metode Primer", "Metode Alokasi"], correctAnswer: 2, explanation: "Rasional: Ciri khas murni Metode Tim (Team Nursing MAKP Indonesia standar akreditasi) adalah terbentuknya Kelompok Kerja mini di ruangan bangsal besar. Ada 1 Bos Kelompok Pemimpin berpendidikan Ners Sarjana hebat tinggi kompeten pintar (Ketua Tim / Katim Ners jago), dibantu bawahan asistennya berpendidikan vokasi SPK/D3 lulusan pelaksana nyuntik memandikan tensi perawat asosiate PP (Anggota Tim pelaksana perawat junior). Mereka gabung kompak merawat 1 lorong blok pasien bareng bareng 8 bed komprehensif rapat tim operan pendelegasian tugas kolaborasi adil.\n\nAnalisis Pilihan Lain:\n• Metode Kasus (Case Method Total Care Kritis khusus ICU PICU 1 on 1): 1 Perawat jaga komprehensif jaga 1 Pasien full 1 shift nyuntik mandiin nyuap doa ngerubah posisi EKG nyampur obat buang pipis sendirian total care 1 orang komplit 1 pasien berat alat banyak sendirian total.\n• Metode Fungsional (Tugas Mandor Pabrik ban berjalan bagi bagi tugas per item kegiatan jadul kuno kaku): 1 Perawat bagian khusus keliling nyuntik bawa troli isi spuit obat aja se bangsal rame 40 bed keliling nusuk pantat minum pil tok keliling, 1 perawat bagian khusus keliling dorong gerobak tensi aja ngukur darah nyatet nadi tok 40 bed, 1 perawat khusus bagian cebok nampung pipis BAB mandiin kasur loper angkat angkat tok, 1 Karu bagian nulis nulis resep pusing kertas status depan tok komandan asuhan pecah pecah fragmen fragmen no komprehensif pasien bingung nanya perawat A dia jawab 'Gatau tanya perawat suntik gih saya cuma bagian tensi tensi doang kaku asuhan jadul fungsional tugas beda beda tugas perawat robot mesin pabrik ban'.\n• Metode Primer (Primary Nursing RS Mewah Internasional Bule): 1 Perawat (PP Perawat Primer) memegang tanggung jawab total 24 jam nonstop desain asuhan nulis diagnose intervensi evaluasi memegang 1 pasien mulai awal pasien masuk IGD daftar ranap sampai pasien sembuh pulang KRS pulang dipertanggungjawabkan nyawa asuhannya di tangan si Primer 1 perawat 1 pasien seumur inap nelfon WA 24 jam kontrol.\n• Metode Alokasi: Bukan istilah baku sistem asuhan standar manajemen keperawatan keperawatan standar MAKP teori rs." },
          { id: 97, rumpun: "Manajemen", text: "Proses operan jaga (Handover) shift malam ke pagi. Metode komunikasi standar baku yang harus dipakai agar info klinis akurat tersampaikan?", options: ["Metode SOAP", "Metode SBAR (Situation, Background, Assessment, Recommendation)", "Metode DAR", "Metode PIE", "Metode Naratif Bebas"], correctAnswer: 1, explanation: "Rasional: Komunikasi SBAR (Situation apa yang darurat lapor nama diagnosa nafas ngos ngosan sesak tensi drop maut dokter tolong, Background riwayat masuk igd tadi malam makan duren ada asma turunan keturunan bawaan alergi, Assessment perawat menilai asidosis paru oksigen drop sat 85 % retraksi gawat sesak parah biru butuh intubasi napas ronkhi asma basah, Recommendation dokter tolong datang pasang ventilator atau izinkan saya injeksi steroid dexametasone sekarang dosis brp dok cepat acc instruksi usulan saran) adalah KOMUNIKASI BAKU KESELAMATAN PASIEN INTERNASIONAL JCI Standar Emas serah terima lapor dokter jaga Handover efektif, ringkas darurat komplit meminimalisir salah dengar salah tangkep salah lapor salah suntik obat mematikan (Patient Safety akreditasi emas SBAR Lisan Handover).\n\nAnalisis Pilihan Lain:\n• Metode SOAP (Subjektif keluhan lisan, Objektif data tensi nalar perawat raba lihat hasil rontgen lab lihat urine EKG stetoskop periksa USG objektif angka ukur mata telinga perawat hitung nadi, Assesment tegak diagnosa masalah teratasi memburuk target evaluasi harian shift, Planning rencana lanjutkan hentikan modifikasi tambah dosis planning pulang): Ini format BAKU TULISAN DOKUMENTASI asuhan nulis di Rekam Medis kertas status harian (RM evaluasi catat kertas tulisan). (Yang ditanya 'Metode KOMUNIKASI verbal operan serah terima' lapor jaga gawat shift operan SBAR bicara omongan).\n• Metode DAR (Data fokus campur DS DO, Action tindakan ngapain perawat kerjain obatin asuhan SAK mandi infus, Response pasien membaik muntah sembuh): Format tulis dokumentasi Fokus POR jadul kertas rekam medis.\n• Metode PIE (Problem masalah diagnosa ketegak tegak asuhan, Intervensi ngapain obatin rencana tindak lanjut perawat, Evaluasi cek membaik perbaikan SO puji SAK): Model dokumentasi tulis kertas tulisan pena RM status pasien.\n• Metode Naratif Bebas (Cerita karangan bebas nulis kronologi lisan ngarang dongeng ga jelas formatnya berantakan): Paling sering dihindari karena rentan tertinggal info penting krusial alergi tensi drop kelewat omong lupa ngomong nyawa melayang nuntut pengadilan malpraktek." },

nolak tapi dipaksa diborgol dicuntik sedasi biar diem ikut oprasi ga tanda tangan potong kaki sepihak amputasi nolak paksa dokter maksa bedah).\n• Confidentiality (Rahasia medis penyakit rekam medis privasi privasi aib info HIV AIDS sifilis cacat kelamin hasil USG aborsi pasien aib rahasia rapet): Perawat gosip rumpi ember bocor menceritakan pasien A tetangganya masuk RS karena ketahuan HIV AIDS Sifilis aborsi pelacur di warung kopi kantin rs denger orang banyak bocor RM rekam medis foto lab viral status WA (Melanggar Confidentiality Hak Privasi Tutup Aib Rahasia Medis Privasi sumpah jabatan jaga aib diam)." },

                              <svg className="w-3.5 h-3.5 text-indigo-500" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zM9 13H7v-2h2v2zm6 0h-4v-2h4v2z"/></svg>
                              {currentQ.rumpun}
                           </span>
                        </div>
                     </div>
                     <div className="flex items-center gap-4 w-full md:w-auto">
                        <div className={`flex-1 md:flex-none justify-center px-6 py-3 rounded-2xl font-mono text-xl font-black flex items-center gap-3 border-2 shadow-sm transition-colors ${timeLeft < 600 ? 'bg-red-50 text-red-600 border-red-200 animate-pulse' : 'bg-white text-slate-700 border-slate-200'}`}>
                          <svg className="w-6 h-6 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                          {formatTime(timeLeft)}
                        </div>
                        <button 
                          onClick={handleFinishClick}
                          className="bg-rose-500 hover:bg-rose-600 text-white px-6 py-3 rounded-2xl font-bold transition-all shadow-md hover:shadow-rose-500/30 whitespace-nowrap"
                        >
                          Selesai
                        </button>
                     </div>
                  </div>

                  {/* Question Content */}
                  <div className="flex-1 overflow-y-auto p-4 md:p-10 custom-scrollbar">
                     <div className="max-w-4xl mx-auto">
                        <div className="bg-white p-6 md:p-10 rounded-3xl shadow-sm border border-slate-200 mb-6">
                          <p className="text-lg md:text-xl text-slate-800 leading-relaxed font-semibold text-justify">
                            {currentQ.text}
                          </p>
                        </div>

                        <div className="space-y-4">
                          {currentQ.options.map((opt, oIndex) => {
                            const isSelected = answers[currentNumber] === oIndex;
                            return (
                              <div key={oIndex} onClick={() => handleAnswer(currentNumber, oIndex)} className={`flex items-start gap-5 p-5 rounded-2xl border-2 cursor-pointer transition-all duration-200 group ${isSelected ? 'border-indigo-500 bg-indigo-50 shadow-md ring-2 ring-indigo-200' : 'border-slate-200 hover:border-indigo-300 hover:bg-white bg-white'}`}>
                                <div className="pt-0.5">
                                   <div className={`w-6 h-6 rounded-full border-2 flex items-center justify-center transition-colors ${isSelected ? 'border-indigo-600 bg-indigo-600' : 'border-slate-300 group-hover:border-indigo-400'}`}>
                                     {isSelected && <div className="w-2.5 h-2.5 bg-white rounded-full"></div>}
                                   </div>
                                </div>
                                <div className="flex-1 flex gap-4">
                                  <span className={`font-black text-lg ${isSelected ? 'text-indigo-700' : 'text-slate-400'}`}>{String.fromCharCode(65 + oIndex)}.</span>
                                  <span className={`text-lg font-medium leading-relaxed ${isSelected ? 'text-indigo-900' : 'text-slate-700'}`}>{opt}</span>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                     </div>
                  </div>

                  {/* Bottom Navigation */}
                  <div className="bg-white px-6 md:px-10 py-5 border-t border-slate-200 flex justify-between items-center shadow-[0_-10px_30px_rgba(0,0,0,0.03)] z-10">
                    <button 
                      onClick={() => setCurrentNumber(prev => Math.max(0, prev - 1))}
                      disabled={currentNumber === 0}
                      className="px-6 md:px-8 py-3.5 rounded-2xl font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 disabled:opacity-40 disabled:cursor-not-allowed transition-all flex items-center gap-2"
                    >
                      <svg className="w-5 h-5 hidden md:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M15 19l-7-7 7-7"></path></svg>
                      Kembali
                    </button>
                    <button 
                      onClick={() => setCurrentNumber(prev => Math.min(questions.length - 1, prev + 1))}
                      disabled={currentNumber === questions.length - 1}
                      className="px-8 md:px-10 py-3.5 rounded-2xl font-black bg-indigo-600 text-white hover:bg-indigo-700 disabled:opacity-40 disabled:cursor-not-allowed transition-all shadow-lg hover:shadow-indigo-500/30 hover:-translate-y-0.5 flex items-center gap-3"
                    >
                      Selanjutnya
                      <svg className="w-5 h-5 hidden md:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M9 5l7 7-7 7"></path></svg>
                    </button>
                  </div>
                </div>

                {/* MODAL KONFIRMASI CUSTOM PREMIUM */}
                {showModal && (
                  <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                     <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onClick={() => setShowModal(false)}></div>
                     <div className="bg-white rounded-3xl shadow-2xl p-8 max-w-sm w-full relative z-10 transform transition-all scale-100 opacity-100">
                        <div className="w-16 h-16 bg-rose-100 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-6">
                          <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                        </div>
                        <h3 className="text-2xl font-black text-slate-800 text-center mb-2">Selesai Ujian?</h3>
                        <p className="text-slate-500 text-center mb-8 font-medium">
                          Anda telah menjawab <span className="font-bold text-emerald-600">{answeredCount}</span> dari 100 soal. Waktu tersisa Anda adalah <span className="font-bold text-slate-800">{formatTime(timeLeft)}</span>. Apakah Anda yakin ingin mengakhiri dan melihat nilai sekarang?
                        </p>
                        <div className="flex gap-4">
                           <button 
                             onClick={() => setShowModal(false)}
                             className="flex-1 py-3.5 rounded-xl font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 transition-colors"
                           >
                             Batal
                           </button>
                           <button 
                             onClick={() => handleFinish(false)}
                             className="flex-1 py-3.5 rounded-xl font-black text-white bg-rose-500 hover:bg-rose-600 shadow-lg shadow-rose-500/30 transition-all hover:-translate-y-0.5"
                           >
                             Ya, Kumpulkan
                           </button>
                        </div>
                     </div>
                  </div>
                )}
              </div>
            );
          }

          // ==========================================
          // RENDER 3: RESULT & REVIEW
          // ==========================================
          if (step === 'RESULT') {
            let correctCount = 0;
            questions.forEach((q, idx) => {
              if (answers[idx] === q.correctAnswer) correctCount++;
            });
            const score = ((correctCount / questions.length) * 100).toFixed(1);

            return (
              <div className="min-h-screen bg-slate-100 py-12 px-4 md:px-8 font-sans">
                <div className="max-w-5xl mx-auto">
                  
                  {/* Dashboard Skor */}
                  <div className="bg-slate-900 rounded-[2rem] shadow-2xl p-8 md:p-12 mb-12 text-center text-white relative overflow-hidden border border-slate-700">
                    <div className="absolute inset-0 bg-gradient-to-br from-indigo-600/20 to-emerald-500/20"></div>
                    <div className="relative z-10">
                      <h2 className="text-4xl md:text-5xl font-black tracking-tight mb-8">HASIL TRYOUT NERS</h2>
                      
                      <div className="flex flex-col md:flex-row justify-center items-stretch gap-6">
                         {/* Skor Utama */}
                         <div className="bg-white text-slate-900 rounded-3xl p-8 shadow-xl flex-1 max-w-sm mx-auto transform hover:scale-105 transition-transform duration-300">
                            <p className="text-sm font-extrabold uppercase tracking-widest text-slate-400 mb-2">Nilai Akhir</p>
                            <p className={`text-7xl font-black ${score >= 60 ? 'text-emerald-500' : 'text-rose-500'}`}>{score}</p>
                            <p className={`mt-4 font-bold rounded-full py-1.5 px-4 inline-block text-sm ${score >= 60 ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}`}>
                              {score >= 60 ? 'Kategori: LULUS KOMPETEN' : 'Kategori: BELUM KOMPETEN'}
                            </p>
                         </div>
                         
                         {/* Detail Jawaban */}
                         <div className="flex flex-col gap-4 flex-1 max-w-sm mx-auto w-full">
                            <div className="bg-emerald-500/10 border border-emerald-500/30 rounded-2xl px-6 py-5 flex items-center justify-between backdrop-blur-sm">
                              <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-emerald-500 rounded-xl flex items-center justify-center text-white font-bold">✓</div>
                                <span className="text-emerald-400 font-bold text-lg">Jawaban Benar</span>
                              </div>
                              <span className="text-3xl font-black text-white">{correctCount}</span>
                            </div>
                            <div className="bg-rose-500/10 border border-rose-500/30 rounded-2xl px-6 py-5 flex items-center justify-between backdrop-blur-sm">
                              <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-rose-500 rounded-xl flex items-center justify-center text-white font-bold">✗</div>
                                <span className="text-rose-400 font-bold text-lg">Jawaban Salah</span>
                              </div>
                              <span className="text-3xl font-black text-white">{questions.length - correctCount - (questions.length - Object.keys(answers).length)}</span>
                            </div>
                            <div className="bg-slate-500/20 border border-slate-500/30 rounded-2xl px-6 py-5 flex items-center justify-between backdrop-blur-sm">
                              <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-slate-500 rounded-xl flex items-center justify-center text-white font-bold">!</div>
                                <span className="text-slate-300 font-bold text-lg">Kosong / Lewat</span>
                              </div>
                              <span className="text-3xl font-black text-white">{questions.length - Object.keys(answers).length}</span>
                            </div>
                         </div>
                      </div>
                    </div>
                  </div>

                  {/* List Pembahasan Lengkap */}
                  <div className="space-y-10">
                    <div className="flex items-center gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                      <div className="w-1.5 h-10 bg-indigo-600 rounded-full"></div>
                      <div>
                         <h3 className="text-2xl font-black text-slate-800">Pembahasan & Rasional Analisis</h3>
                         <p className="text-slate-500 font-medium mt-1">Review detail setiap soal beserta analisis pilihan gandanya (Distraktor).</p>
                      </div>
                    </div>

                    {questions.map((q, idx) => {
                      const userAnswer = answers[idx];
                      const isCorrect = userAnswer === q.correctAnswer;
                      const isUnanswered = userAnswer === undefined;
                      
                      return (
                        <div key={idx} className="bg-white rounded-[2rem] shadow-sm border border-slate-200 overflow-hidden">
                          {/* Header Soal Hasil */}
                          <div className={`px-8 py-5 text-white font-bold flex flex-wrap gap-4 justify-between items-center ${isCorrect ? 'bg-emerald-500' : isUnanswered ? 'bg-slate-500' : 'bg-rose-500'}`}>
                             <div className="flex items-center gap-3">
                                <span className="bg-black/20 px-4 py-1.5 rounded-xl text-lg">Soal {idx + 1}</span>
                                <span className="text-sm font-bold bg-white/20 px-3 py-1.5 rounded-lg border border-white/10 uppercase tracking-wide">{q.rumpun}</span>
                             </div>
                             <div className="bg-black/20 px-4 py-1.5 rounded-xl flex items-center gap-2">
                                {isCorrect ? 'BENAR' : isUnanswered ? 'KOSONG' : 'SALAH'}
                             </div>
                          </div>
                          
                          {/* Konten Soal Hasil */}
                          <div className="p-8 md:p-10">
                             <p className="text-slate-800 mb-8 font-semibold leading-relaxed text-lg text-justify">{q.text}</p>
                             
                             <div className="space-y-3 mb-10">
                               {q.options.map((opt, oIndex) => {
                                 const isSelected = userAnswer === oIndex;
                                 const isActualCorrect = q.correctAnswer === oIndex;
                                 
                                 let bgClass = "bg-slate-50 border-slate-200 text-slate-500";
                                 if (isActualCorrect) bgClass = "bg-emerald-50 border-emerald-400 text-emerald-900 ring-2 ring-emerald-500/50 shadow-sm";
                                 else if (isSelected && !isActualCorrect) bgClass = "bg-rose-50 border-rose-300 text-rose-900";

                                 return (
                                   <div key={oIndex} className={`p-4 md:p-5 rounded-2xl border-2 flex flex-col md:flex-row items-start md:items-center gap-4 ${bgClass}`}>
                                      <div className="flex items-center gap-4 w-full md:w-auto flex-1">
                                        <span className={`w-10 h-10 rounded-xl flex-shrink-0 flex items-center justify-center text-lg font-black border-2 ${isActualCorrect ? 'bg-emerald-500 border-emerald-600 text-white' : isSelected ? 'bg-rose-500 border-rose-600 text-white' : 'bg-white border-slate-300 text-slate-500'}`}>
                                          {String.fromCharCode(65 + oIndex)}
                                        </span>
                                        <span className={`font-semibold text-base md:text-lg ${isActualCorrect ? 'font-bold' : ''}`}>{opt}</span>
                                      </div>
                                      
                                      <div className="flex gap-2 w-full md:w-auto justify-end pl-14 md:pl-0">
                                        {isSelected && <span className={`text-xs px-3 py-1.5 rounded-lg font-black uppercase tracking-wide ${isActualCorrect ? 'bg-emerald-200 text-emerald-800' : 'bg-rose-200 text-rose-800'}`}>Jawaban Anda</span>}
                                        {isActualCorrect && !isSelected && <span className="text-xs px-3 py-1.5 rounded-lg font-black uppercase tracking-wide bg-emerald-200 text-emerald-800 shadow-sm">Kunci Jawaban</span>}
                                      </div>
                                   </div>
                                 );
                               })}
                             </div>

                             {/* Rasional / Pembahasan */}
                             <div className="bg-indigo-50/70 border border-indigo-100 rounded-3xl p-6 md:p-8 relative">
                                <div className="absolute top-0 left-8 w-12 h-1 bg-indigo-500 rounded-b-full"></div>
                                <div className="flex items-center gap-3 mb-4 text-indigo-900">
                                   <svg className="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                                   <h4 className="font-black text-xl">Rasional & Analisis Distraktor</h4>
                                </div>
                                {/* CLASS whitespace-pre-line membuat enter di string \n\n menjadi enter baris nyata */}
                                <div className="text-indigo-900/80 font-medium text-base md:text-lg leading-relaxed text-justify whitespace-pre-line">
                                   {q.explanation}
                                </div>
                             </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>

                  <div className="mt-16 text-center pb-20">
                    <button 
                      onClick={() => {
                        setStep('GATE');
                        setAnswers({});
                      }}
                      className="px-12 py-5 bg-slate-900 hover:bg-black text-white font-black text-lg rounded-2xl shadow-xl hover:shadow-2xl transition-all transform hover:-translate-y-1 inline-flex items-center gap-3"
                    >
                      <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                      Kembali ke Menu Utama
                    </button>
                  </div>

                </div>
              </div>
            );
          }

          return null;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
