    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- DATABASE 100 SOAL VIGNETTE UNIK (HARDCODED & PEMBAHASAN SUPER DETAIL) ---
        const questionsData = [
          // --- GAWAT DARURAT (1-10) ---
          { 
            id: 1, rumpun: "Gawat Darurat", 
            text: "Seorang laki-laki 45 tahun dibawa ke IGD akibat kecelakaan. Pasien tidak sadar, terdengar suara napas gurgling, jejas di dada kanan. Nadi 110x/m, RR 28x/m. Tindakan prioritas?", 
            options: ["Needle thoracostomy", "Suction jalan napas", "Pasang infus 2 jalur", "Oksigen NRM 10 Lpm", "Pasang collar neck"], 
            correctAnswer: 1, 
            explanation: "Rasional: Suara napas gurgling (kumur-kumur) adalah tanda objektif adanya cairan (darah/sekret/muntahan) pada jalan napas atas. Berdasarkan prinsip resusitasi trauma (ABC), intervensi pembebasan jalan napas (Airway) dari cairan mekanis mutlak dilakukan dengan suction.\n\nAnalisis Pilihan Lain:\n• Needle thoracostomy: Salah, ini intervensi Breathing untuk Tension Pneumothorax.\n• Pasang infus 2 jalur: Salah, ini intervensi Circulation untuk mencegah syok hipovolemik, dilakukan setelah Airway aman.\n• Oksigen NRM: Salah, oksigen tidak akan masuk optimal jika jalan napas masih tersumbat cairan.\n• Pasang collar neck: Penting untuk kontrol servikal, namun untuk mengatasi gurgling secara spesifik tindakan langsungnya adalah suction." 
          },
          { 
            id: 2, rumpun: "Gawat Darurat", 
            text: "Perempuan 30 tahun tiba di IGD dengan luka bakar terkena air panas. Luka tampak kemerahan, melepuh (bula), dan sangat nyeri pada seluruh dada, perut, dan lengan kanan. Luas luka bakar menurut Rule of Nines?", 
            options: ["18%", "27%", "36%", "45%", "9%"], 
            correctAnswer: 1, 
            explanation: "Rasional: Berdasarkan perhitungan standar 'Rule of Nines' untuk pasien dewasa: Seluruh area dada dan perut (Anterior Trunk) bernilai 18%, sedangkan seluruh bagian lengan kanan (depan & belakang) bernilai 9%. Maka 18% + 9% = 27%.\n\nAnalisis Pilihan Lain:\n• 18%: Salah, ini hanya menghitung area dada dan perut depan saja, lengan kanannya tidak dihitung.\n• 36%: Salah, ini adalah perhitungan untuk seluruh batang tubuh depan (18%) dan belakang (18%).\n• 45%: Hasil perhitungan yang berlebihan dan tidak sesuai anatomi kasus.\n• 9%: Salah, ini hanya menghitung area lengan kanannya saja." 
          },
          { 
            id: 3, rumpun: "Gawat Darurat", 
            text: "Laki-laki 55 tahun mengeluh nyeri dada kiri menjalar ke rahang dan lengan kiri. EKG menunjukkan ST Elevasi. Pasien tampak gelisah dan berkeringat dingin. Obat awal yang paling tepat diberikan (MONA) untuk mengurangi nyeri iskemik?", 
            options: ["Morfin", "Oksigen", "Nitrogliserin", "Aspirin", "Clopidogrel"], 
            correctAnswer: 2, 
            explanation: "Rasional: Pada pasien Sindrom Koroner Akut (STEMI), Nitrogliserin (Nitrat) sublingual berfungsi sebagai vasodilator koroner yang melebarkan pembuluh darah jantung, meningkatkan suplai darah iskemik, dan secara efektif mengurangi nyeri dada spesifik jantung (angina).\n\nAnalisis Pilihan Lain:\n• Morfin: Diberikan HANYA JIKA nyeri dada tidak kunjung hilang setelah pemberian Nitrogliserin maksimal 3 dosis.\n• Oksigen: Diberikan untuk memaksimalkan oksigenasi jaringan, namun bukan penghilang rasa nyeri (analgesik) langsung.\n• Aspirin & Clopidogrel: Ini adalah antiplatelet untuk mencegah pembekuan darah lebih lanjut, bukan untuk mengurangi intensitas nyeri saat serangan terjadi." 
          },
          { 
            id: 4, rumpun: "Gawat Darurat", 
            text: "Pasien henti jantung di IGD. Perawat sedang melakukan RJP (30 kompresi : 2 ventilasi). Tiba-tiba monitor menunjukkan irama Ventrikel Fibrilasi (VF). Tindakan perawat selanjutnya?", 
            options: ["Lanjutkan RJP", "Berikan Epinefrin", "Lakukan Defibrilasi (DC Shock)", "Cek nadi karotis", "Berikan Amiodaron"], 
            correctAnswer: 2, 
            explanation: "Rasional: Ventrikel Fibrilasi (VF) dan Ventrikel Takikardia tanpa nadi (VT Pulseless) diklasifikasikan sebagai irama 'Shockable'. Tindakan live-saving mutlak dan pertama yang harus segera dilakukan saat irama ini terdeteksi adalah Defibrilasi (DC Shock) untuk me-reset kelistrikan jantung.\n\nAnalisis Pilihan Lain:\n• Lanjutkan RJP: RJP ditunda sejenak untuk persiapan alat DC Shock segera, RJP dilanjutkan tepat setelah alat melepas kejut listrik.\n• Berikan Epinefrin: Obat ini diberikan setelah siklus shock kedua atau pada irama non-shockable (Asistol/PEA).\n• Cek nadi karotis: Tidak perlu membuang waktu cek nadi pada irama VF, karena VF sudah dipastikan tidak menghasilkan curah jantung (tanpa nadi).\n• Berikan Amiodaron: Ini adalah antiaritmia yang diberikan setelah siklus shock ketiga gagal." 
          },
          { 
            id: 5, rumpun: "Gawat Darurat", 
            text: "Pasien laki-laki 20 tahun korban tawuran datang dengan luka tusuk di perut, usus terburai. Pasien sadar, TD 90/60 mmHg, N 115x/m. Penanganan awal pada usus yang terburai?", 
            options: ["Masukkan usus perlahan ke dalam perut", "Tekan usus dengan kassa kering", "Tutup usus dengan kassa steril lembab NaCl", "Biarkan terbuka dan pasang infus guyur", "Bebat tekan kuat di area luka"], 
            correctAnswer: 2, 
            explanation: "Rasional: Eviserasi (usus terburai) sangat berisiko menyebabkan usus menjadi kering, infeksi, dan mati (nekrosis). Menutupnya dengan kassa steril yang dibasahi cairan isotonis (NaCl 0.9%) menjaga kelembaban usus sambil menunggu operasi.\n\nAnalisis Pilihan Lain:\n• Masukkan usus: SANGAT DILARANG, memasukkan paksa organ yang terburai di luar kamar operasi dapat merobek organ dan membawa bakteri luar masuk ke rongga peritonium.\n• Tekan kassa kering: Kassa kering akan menempel pada mukosa usus dan merusaknya saat dilepas.\n• Biarkan terbuka: Akan mempercepat usus mengering dan nekrosis.\n• Bebat tekan: Dilarang untuk luka eviserasi karena akan menghancurkan (crushing) jaringan usus yang lembut." 
          },
          { 
            id: 6, rumpun: "Gawat Darurat", 
            text: "Di lokasi bencana gempa, perawat menemukan korban berteriak minta tolong. Terdapat fraktur terbuka di kaki kanan dengan perdarahan aktif. Berdasarkan Triage START, apa warna label korban ini?", 
            options: ["Hitam", "Merah", "Kuning", "Hijau", "Putih"], 
            correctAnswer: 1, 
            explanation: "Rasional: Korban mengalami perdarahan masif aktif (mengancam nyawa dalam hitungan menit/jam) namun masih sadar (berteriak). Kondisi kritis yang masih memiliki harapan hidup tinggi jika segera ditangani masuk dalam kategori Prioritas 1 (Merah/Immediate).\n\nAnalisis Pilihan Lain:\n• Hitam: Untuk korban yang sudah meninggal atau luka sangat parah yang harapan hidupnya nol (misal otak terburai).\n• Kuning: Untuk korban luka berat namun tidak mengancam nyawa segera (misal fraktur tertutup tanpa syok), penanganan bisa ditunda beberapa jam.\n• Hijau: Untuk korban luka ringan yang bisa berjalan (walking wounded).\n• Putih: Bukan warna standar internasional dalam sistem Triage START bencana." 
          },
          { 
            id: 7, rumpun: "Gawat Darurat", 
            text: "Perempuan 25 tahun tersedak bakso. Pasien memegang leher, tidak bisa bicara, dan wajah mulai kebiruan. Pasien dalam keadaan berdiri. Tindakan yang harus dilakukan perawat?", 
            options: ["Back blow 5x", "Chest thrust 5x", "Heimlich maneuver (Abdominal thrust)", "RJP kompresi dada", "Finger sweep"], 
            correctAnswer: 2, 
            explanation: "Rasional: Pasien mengalami sumbatan jalan napas total (choking sign: pegang leher, kebiruan, tak bisa bicara) pada dewasa yang MASIH SADAR dan berdiri. Intervensi baku (AHA Guideline) adalah Heimlich Maneuver (hentakan perut) untuk mendorong diafragma dan memompa udara keluar membuang sumbatan.\n\nAnalisis Pilihan Lain:\n• Back blow 5x: Ini biasanya digunakan untuk bayi (infant <1 tahun) yang dikombinasikan dengan chest thrust, tidak efektif untuk dewasa.\n• Chest thrust 5x: Dilakukan pada dewasa HANYA jika pasien obesitas morbid atau ibu hamil besar, di mana perut tidak bisa dipeluk.\n• RJP kompresi dada: Dilakukan HANYA jika pasien tersedak sudah jatuh dan TIDAK SADAR (unresponsive).\n• Finger sweep (sapuan jari): Dilarang (blind sweep) jika benda asing tidak terlihat jelas, karena berisiko mendorong benda lebih dalam." 
          },
          { 
            id: 8, rumpun: "Gawat Darurat", 
            text: "Laki-laki 60 tahun di IGD dengan asma eksaserbasi akut. RR 35x/m, wheezing (+), tampak penggunaan otot bantu napas. Setelah diberikan Nebulizer Salbutamol 1 ampul, wheezing masih ada. Tindakan kolaborasi selanjutnya?", 
            options: ["Nebulizer ulang", "Injeksi Dexamethasone", "Berikan Aminofilin drip", "Berikan Oksigen 10 Lpm", "Berikan Injeksi Epinefrin"], 
            correctAnswer: 1, 
            explanation: "Rasional: Salbutamol adalah bronkodilator kerja cepat (SABA). Jika serangan asma tidak membaik (wheezing menetap), pedoman GINA merekomendasikan penambahan Kortikosteroid Sistemik (injeksi dexamethasone/methylprednisolone) untuk mengatasi proses inflamasi akut jalan napas yang mendasarinya.\n\nAnalisis Pilihan Lain:\n• Nebulizer ulang: Bisa dilakukan, namun steroid harus segera masuk. Mengulang SABA terus menerus tanpa steroid kurang efektif mengatasi inflamasi alerginya.\n• Aminofilin drip: Obat lini ketiga/terakhir jika pasien sangat memburuk dan terancam gagal napas, bukan pilihan kedua.\n• Oksigen 10 Lpm: Oksigen diberikan dari awal, namun ia tidak melebarkan saluran napas (tidak menghentikan wheezing).\n• Injeksi Epinefrin: Hanya digunakan untuk reaksi Anafilaksis (alergi sistemik berat), bukan untuk serangan asma biasa." 
          },
          { 
            id: 9, rumpun: "Gawat Darurat", 
            text: "Seorang petani digigit ular berbisa di betis kanan 30 menit lalu. Tampak bengkak kemerahan dan 2 titik luka gigitan. Tindakan pertolongan pertama pre-hospital?", 
            options: ["Hisap bisa ular dari luka", "Ikat tourniquet kuat di atas luka", "Insisi silang pada luka", "Imobilisasi anggota gerak yang digigit", "Beri kompres es pada luka"], 
            correctAnswer: 3, 
            explanation: "Rasional: Penyebaran bisa ular paling banyak terjadi melalui pembuluh limfatik yang pergerakannya dipompa oleh kontraksi otot. Imobilisasi ekstremitas (pemasangan bidai dan membatasi gerak) bertujuan meminimalisir gerakan otot sehingga penyebaran bisa ke seluruh tubuh melambat drastis.\n\nAnalisis Pilihan Lain:\n• Hisap bisa ular: Berbahaya bagi penolong (bisa masuk via luka di mulut) dan terbukti tidak efektif secara medis.\n• Ikat tourniquet: Dilarang keras, karena menahan darah total akan membuat jaringan di bawah ikatan mati (nekrosis) dan berujung amputasi.\n• Insisi silang: Dilarang, akan memperparah perdarahan dan meningkatkan risiko infeksi sekunder masif.\n• Kompres es: Vasokonstriksi ekstrem dari es dapat memperparah kerusakan sel (nekrosis) di area gigitan yang sudah terinfestasi racun enzim." 
          },
          { 
            id: 10, rumpun: "Gawat Darurat", 
            text: "Pasien tidak sadar dibawa ke IGD pasca kecelakaan dengan kecurigaan cedera servikal. Bagaimana cara membebaskan jalan napas yang paling aman?", 
            options: ["Head tilt", "Chin lift", "Jaw thrust", "Hiper-ekstensi leher", "Pemasangan OPA langsung"], 
            correctAnswer: 2, 
            explanation: "Rasional: Pada pasien trauma dengan risiko/kecurigaan cedera tulang leher (servikal), membebaskan jalan napas harus menghindari pergerakan kepala. Manuver 'Jaw Thrust' (mengangkat sudut rahang bawah ke depan tanpa menengadahkan kepala) adalah satu-satunya teknik manual yang diizinkan.\n\nAnalisis Pilihan Lain:\n• Head tilt & Chin lift: Dilarang pada cedera servikal karena manipulasi menengadahkan (ekstensi) kepala dapat merobek korda spinalis dan memicu kelumpuhan total atau kematian seketika.\n• Hiper-ekstensi leher: Sama seperti Head Tilt, sangat mematikan bagi pasien cedera tulang leher.\n• Pemasangan OPA: OPA adalah alat bantu, namun teknik manual (Jaw Thrust) tetap harus dilakukan terlebih dahulu untuk membuka jalan napas sebelum alat dimasukkan." 
          },
          
          // --- KMB (11-40) ---
          { id: 11, rumpun: "KMB", text: "Laki-laki 50 tahun dirawat dengan Gagal Jantung Kongestif (CHF). Pasien sesak, JVP 5+4 cmH2O, edema tungkai +2. Masalah keperawatan utama?", options: ["Intoleransi aktivitas", "Pola napas tidak efektif", "Penurunan curah jantung", "Kelebihan volume cairan", "Gangguan pertukaran gas"], correctAnswer: 2, explanation: "Rasional: Gagal jantung kanan (ditandai peningkatan JVP) dan gagal jantung kiri secara klinis bermuara pada kegagalan jantung sebagai pompa. Manifestasi JVP naik dan edema tungkai adalah tanda kongesti akibat penurunan pompa efektif. Maka diagnosa 'Penurunan curah jantung' adalah akar masalah hemodinamiknya.\n\nAnalisis Pilihan Lain:\n• Intoleransi aktivitas: Ini adalah masalah sekunder (akibat) dari suplai oksigen yang buruk karena pompa jantung melemah.\n• Pola napas tidak efektif: CHF menyebabkan sesak karena masalah perfusi/akumulasi cairan, bukan karena gangguan otot napas primer.\n• Kelebihan volume cairan: Ini adalah diagnosis simtomatik (akibat retensi air), namun etiologi patofisiologis utamanya adalah gagal pompa jantung.\n• Gangguan pertukaran gas: Relevan jika ada ronkhi basah masif (edema paru), namun tidak menyelesaikan inti masalah kardiaknya." },
          { id: 12, rumpun: "KMB", text: "Perempuan 40 tahun dengan DM Tipe 2 mengeluh lemas, keringat dingin, gemetar. GDS: 50 mg/dL. Pasien sadar dan bisa menelan. Tindakan segera?", options: ["Injeksi D40% 2 flakon", "Berikan air gula manis per oral", "Pasang infus D5%", "Injeksi Insulin kerja cepat", "Observasi 15 menit"], correctAnswer: 1, explanation: "Rasional: Pasien mengalami syok hipoglikemia ringan-sedang karena GDS <70 mg/dL. Kunci pada kasus ini adalah pasien 'SADAR DAN BISA MENELAN'. Tindakan paling cepat dan non-invasif adalah memberikan karbohidrat sederhana secara oral (seperti air teh manis atau permen).\n\nAnalisis Pilihan Lain:\n• Injeksi D40%: Terapi ini diindikasikan jika pasien hipoglikemia TIDAK SADAR (koma hipoglikemik) dan tidak bisa menelan.\n• Pasang infus D5%: Proses ini membutuhkan waktu (pemasangan iv line), sedangkan oral lebih cepat diserap untuk hipoglikemi sadar.\n• Injeksi Insulin: Sangat berbahaya (fatal error), insulin akan menurunkan gula darah pasien yang sudah sangat drop (membunuh pasien).\n• Observasi 15 menit: Salah, hipoglikemia merusak otak dengan cepat, intervensi gula harus segera dilakukan." },
          { id: 13, rumpun: "KMB", text: "Pasien TB Paru mengeluh batuk darah (hemoptisis) sejak pagi. TD 110/70, N 90, RR 24. Intervensi mandiri keperawatan?", options: ["Lakukan fisioterapi dada", "Latih batuk efektif", "Posisikan semi fowler / fowler", "Berikan obat anti-koagulan", "Suction secara dalam"], correctAnswer: 2, explanation: "Rasional: Pasien batuk darah (hemoptisis) membutuhkan pengurangan tekanan intratorakal dan kemudahan pernapasan. Posisi semi fowler/fowler meningkatkan ekspansi paru dan mencegah aspirasi darah ke paru sebelahnya secara mandiri tanpa menambah trauma.\n\nAnalisis Pilihan Lain:\n• Fisioterapi dada: SANGAT KONTRAINDIKASI. Menepuk-nepuk punggung pasien yang sedang pendarahan aktif paru akan memperparah perdarahan.\n• Latih batuk efektif: Kontraindikasi, batuk kuat akan memecahkan lebih banyak pembuluh darah paru yang rapuh.\n• Obat anti-koagulan: Obat ini mengencerkan darah, justru akan membuat pasien semakin parah pendarahannya.\n• Suction dalam: Suction buta ke saluran bawah akan memicu refleks batuk keras dan merusak mukosa paru." },
          { id: 14, rumpun: "KMB", text: "Laki-laki 65 tahun paska operasi BPH hari pertama. Terpasang kateter irigasi (CBI) cairan menetes lancar, urine output berwarna merah muda (pink). Evaluasi keperawatan?", options: ["Hentikan irigasi segera", "Percepat tetesan irigasi", "Kondisi normal, pertahankan irigasi", "Lapor dokter bedah", "Bilas manual dengan spuit"], correctAnswer: 2, explanation: "Rasional: Pasca operasi prostat (TURP), adalah fisiologis dan sangat normal jika warna urin pada hari pertama (H+1) tampak merah muda (pinkish) dengan tetesan lancar. Ini menandakan Continuous Bladder Irrigation (CBI) berhasil mencegah bekuan darah (clotting).\n\nAnalisis Pilihan Lain:\n• Hentikan irigasi: Salah, menghentikan irigasi hari pertama akan langsung menyebabkan bekuan darah dan retensi urin menyakitkan.\n• Percepat tetesan: Tidak perlu, warna urin merah muda sudah target. Irigasi hanya dipercepat jika urin berwarna merah pekat (frank blood) atau ada jendalan darah.\n• Lapor dokter bedah: Tidak perlu dilaporkan segera karena ini adalah temuan klinis normal dan diharapkan.\n• Bilas manual: Hanya dilakukan jika selang tersumbat (tidak menetes), sedangkan di kasus tetesan lancar." },
          { id: 15, rumpun: "KMB", text: "Pasien perempuan 45 tahun dirawat karena Gagal Ginjal Kronis (CKD) on HD. Pasien mengeluh sesak napas. Terdapat udem anasarka, RR 26x/m. Pembatasan cairan apa yang tepat?", options: ["1000 cc/hari", "Urine output 24 jam + 500 cc", "Sesuai rasa haus pasien", "500 cc/hari mutlak", "2000 cc/hari"], correctAnswer: 1, explanation: "Rasional: Pada pasien Gagal Ginjal Kronik (CKD) oliguria/anuria, cairan yang masuk harus diseimbangkan dengan cairan yang keluar. Rumus standar EBP pembatasan cairan adalah: Jumlah haluaran urin 24 jam terakhir ditambah dengan IWL (Insensible Water Loss) sekitar 500-600 cc.\n\nAnalisis Pilihan Lain:\n• 1000 cc/hari: Terlalu umum, bisa jadi overhidrasi jika pasien sama sekali tidak kencing (anuria urin 0 cc).\n• Sesuai rasa haus: Salah, rasa haus pasien GGK sering kali palsu dan akan menyebabkan kelebihan cairan parah hingga edema paru mematikan.\n• 500 cc/hari mutlak: Tidak fleksibel, jika pasien masih bisa kencing 500cc, ia justru akan dehidrasi intraseluler.\n• 2000 cc/hari: Ini anjuran hidrasi orang normal, akan membunuh pasien gagal ginjal yang tidak bisa membuang cairan." },
          { id: 16, rumpun: "KMB", text: "Laki-laki 35 tahun pasca operasi Fraktur Femur hari ke-2. Mengeluh nyeri hebat di kaki yang dioperasi, kebas, dan nadi dorsalis pedis tidak teraba. Komplikasi apa yang terjadi?", options: ["Syok Hipovolemik", "Sindrom Kompartemen", "DVT", "Emboli Paru", "Infeksi Luka"], correctAnswer: 1, explanation: "Rasional: Tanda klinis '5P' (Pain yang hebat tidak wajar, Pallor pucat, Paresthesia kebas, Pulselessness nadi hilang, Paralysis) adalah patognomonik mutlak dari Compartment Syndrome. Peningkatan tekanan dalam selubung otot menghambat sirkulasi darah dan menyebabkan nekrosis saraf/otot dengan cepat.\n\nAnalisis Pilihan Lain:\n• Syok Hipovolemik: Ditandai dengan tanda vital kolaps (TD turun tajam, Nadi naik cepat merata), bukan gejala spesifik di satu kaki.\n• DVT: Trombosis vena dalam ditandai kaki hangat, bengkak kemerahan (Homan sign +), dan nadi pedis biasanya MASIH teraba.\n• Emboli Paru: Gejala khasnya adalah distres pernapasan akut (sesak hebat mendadak) dan nyeri dada.\n• Infeksi Luka: Ditandai dengan demam tinggi, area sayatan bernanah, rubor dan kalor, bukan hilangnya pulsasi nadi bawah." },
          { id: 17, rumpun: "KMB", text: "Perempuan 50 tahun dirawat dengan Sirosis Hepatis. Perut tampak asites masif, pasien sesak napas. Intervensi prioritas untuk mengatasi sesaknya?", options: ["Batasi cairan ketat", "Berikan Oksigen nasal kanul", "Posisikan semifowler", "Kolaborasi parasentesis", "Berikan diuretik loop"], correctAnswer: 2, explanation: "Rasional: Sesak napas pada pasien asites masif bersifat MEKANIK. Cairan perut mendesak otot diafragma ke atas sehingga paru tidak bisa mengembang optimal. Posisi Semifowler/Fowler memanfaatkan gravitasi menurunkan tekanan asites ke arah panggul, seketika membebaskan ekspansi paru.\n\nAnalisis Pilihan Lain:\n• Batasi cairan: Intervensi jangka panjang untuk asitesnya, tidak menyelesaikan masalah sesak yang akut saat itu juga.\n• Oksigen: Kurang optimal jika masalah utamanya paru tergencet (restriktif mekanik), oksigen tidak menyelesaikan rongga yang sempit.\n• Kolaborasi parasentesis: Ini adalah tindakan medis definitif, namun perawat wajib melakukan intervensi posisional terlebih dahulu sambil menunggu tindakan medis.\n• Berikan diuretik: Intervensi farmakologis jangka panjang untuk asites, efeknya lama dan tidak instan meredakan sesak mekanik." },
          { id: 18, rumpun: "KMB", text: "Pasien Thypoid hari ke-5. Suhu 39°C. Pasien mengatakan mulutnya terasa pahit dan tidak nafsu makan. Diet yang paling tepat dianjurkan?", options: ["Tinggi serat", "Rendah serat, lunak", "Tinggi kalori tinggi protein (TKTP) keras", "Cair jernih", "Puasa parsial"], correctAnswer: 1, explanation: "Rasional: Patofisiologi Demam Tifoid adalah infeksi Salmonella pada usus halus (plak peyeri) yang menipiskan dinding usus. Diet 'Rendah Serat dan Lunak' diwajibkan untuk meminimalkan kerja mekanik usus, mempermudah cerna, dan mencegah komplikasi terburuk yakni perforasi/perdarahan usus.\n\nAnalisis Pilihan Lain:\n• Tinggi serat: SANGAT DILARANG, serat tinggi merangsang peristaltik kuat usus yang sedang meradang dan rapuh, memicu usus jebol.\n• TKTP keras: Bentuk keras (misal nasi kerupuk/daging alot) sulit dicerna dan akan melukai usus halus yang tipis.\n• Cair jernih: Tidak mencukupi kebutuhan kalori pasien yang sedang demam tinggi (hipermetabolik).\n• Puasa parsial: Pasien butuh nutrisi untuk imun tubuh melawan kuman, puasa memperburuk malnutrisi demam tifoid." },
          { id: 19, rumpun: "KMB", text: "Laki-laki 55 tahun menderita Stroke Non-Hemoragik. Hemiparese kanan, bicara pelo (disartria). Pasien tersedak saat minum air. Risiko komplikasi tertinggi?", options: ["Malnutrisi", "Aspirasi Pneumonia", "Dekubitus", "Kontraktur", "Depresi"], correctAnswer: 1, explanation: "Rasional: Disfagia (sulit menelan) yang ditandai dengan refleks batuk/tersedak saat minum cairan pada pasien stroke stroke saraf kranial memunculkan risiko fatal Aspirasi. Cairan/makanan yang masuk ke trakea dan paru (bukan lambung) akan langsung memicu Aspirasi Pneumonia yang sangat mematikan pada pasien neurologis.\n\nAnalisis Pilihan Lain:\n• Malnutrisi: Adalah risiko jangka panjang akibat sulit makan, namun bahaya nyawa terdekat (kegawatan) dari tersedak adalah paru-paru penuh air.\n• Dekubitus: Risiko dari immobilisasi (hemiparese), bukan dari refleks tersedak.\n• Kontraktur: Risiko otot muskuloskeletal karena kelumpuhan, tidak terkait dengan kejadian tersedak air minum.\n• Depresi: Komplikasi psikologis pasca-stroke, tidak langsung berakibat fatal secara biologis." },
          { id: 20, rumpun: "KMB", text: "Pasien Appendisitis akut menunggu jadwal operasi. Mengeluh nyeri hebat di perut kanan bawah skala 8. Pasien minta dikompres. Edukasi perawat?", options: ["Boleh kompres hangat", "Boleh kompres dingin/es", "Lakukan massage perut", "Beri obat analgetik oral", "Kompres plester hangat"], correctAnswer: 1, explanation: "Rasional: Pada radang usus buntu (Apendisitis akut), kompres dingin (es) diizinkan karena menyebabkan vasokonstriksi lokal yang mengurangi edema, aliran darah inflamasi, dan menumpulkan sinyal nyeri perifer dengan aman.\n\nAnalisis Pilihan Lain:\n• Kompres hangat: SANGAT DILARANG PADA APENDISITIS. Suhu hangat memicu vasodilatasi pembuluh darah apendiks, memperparah inflamasi, dan bisa menyebabkan usus buntu tersebut PECAH (perforasi/peritonitis) fatal.\n• Massage perut: Dilarang keras karena tekanan mekanis bisa memecahkan apendiks yang bengkak.\n• Obat analgetik oral: Dilarang menjelang operasi perut akut, karena pasien suspek operasi wajib puasa (NPO) dan analgetik dapat menutupi gejala progresivitas keparahan penyakit perut (masking effect).\n• Kompres plester hangat: Sama bahayanya dengan kompres hangat air." },
          { id: 21, rumpun: "KMB", text: "Pasien dengan HIV positif mengalami kandidiasis oral berat (sariawan tebal putih di lidah). Diagnosa keperawatan utama terkait nutrisi?", options: ["Defisit nutrisi", "Risiko aspirasi", "Gangguan menelan", "Ketidakseimbangan kadar glukosa", "Risiko infeksi sekunder"], correctAnswer: 0, explanation: "Rasional: Kandidiasis oral berat pada ODHA menimbulkan nyeri saat mengunyah dan menelan (odinofagia), yang secara langsung menyebabkan penurunan drastis asupan kalori/makanan. Hal ini menjadikan 'Defisit Nutrisi' sebagai masalah aktual utama yang harus segera diselesaikan karena mengancam kekebalan tubuh pasien HIV lebih jauh.\n\nAnalisis Pilihan Lain:\n• Risiko aspirasi: Kandidiasis tidak mengganggu katup epiglotis atau refleks batuk, hanya menimbulkan rasa nyeri mukosa oral.\n• Gangguan menelan: Ini adalah masalah nyata (etiologi), namun NANDA/SDKI lebih menyoroti dampak akhir sistemiknya yaitu Defisit Nutrisi dari keengganan pasien untuk makan.\n• Ketidakseimbangan glukosa: Tidak ada data penyerta lab gula darah atau riwayat DM.\n• Risiko infeksi sekunder: Fokus pertanyaan adalah 'terkait nutrisi'." },
          { id: 22, rumpun: "KMB", text: "Laki-laki 40 tahun dengan asam urat (Gout) akut di jempol kaki. Kemerahan, bengkak, sangat nyeri. Edukasi makanan yang harus dihindari mutlak?", options: ["Susu dan telur", "Kacang-kacangan dan jeroan", "Sayur hijau muda", "Nasi putih", "Buah-buahan asam"], correctAnswer: 1, explanation: "Rasional: Gout Arthritis disebabkan oleh penumpukan kristal asam urat yang merupakan produk akhir metabolisme Purin. Makanan yang mengandung purin tertinggi (yang harus dipantang mutlak saat serangan) adalah jeroan (ati, ampela, otak), seafood, dan kacang-kacangan/melinjo.\n\nAnalisis Pilihan Lain:\n• Susu dan telur: Ini adalah sumber protein yang rendah purin, sangat aman dan justru dianjurkan bagi penderita asam urat.\n• Sayur hijau muda: Beberapa sayur seperti bayam mengandung purin sedang, namun yang mutlak dihindari adalah golongan kacang & jeroan.\n• Nasi putih: Karbohidrat kompleks yang aman dari purin.\n• Buah-buahan asam: Vitamin C (asam) justru membantu ekskresi asam urat dari ginjal, tidak dilarang." },
          { id: 23, rumpun: "KMB", text: "Perempuan 30 tahun dengan hipertiroid (Grave's Disease). Nadi 110x/m, exophthalmos (+), sering merasa kepanasan, berat badan turun tajam. Lingkungan yang tepat?", options: ["Hangat dan lembab", "Terang dan bising", "Sejuk dan tenang", "Isolasi ketat", "Bebas alergen"], correctAnswer: 2, explanation: "Rasional: Hipertiroidisme mengakibatkan hipermetabolisme ekstrim di seluruh tubuh. Pasien mengalami intoleransi panas (heat intolerance) dan labilitas emosi/mudah cemas (nervousness). Lingkungan yang 'Sejuk (mengatasi kepanasan) dan Tenang (menurunkan agitasi simpatis)' sangat krusial sebagai terapi lingkungan.\n\nAnalisis Pilihan Lain:\n• Hangat dan lembab: SANGAT SALAH, ini justru cocok untuk penderita Hipotiroid. Pasien hipertiroid akan sangat tersiksa di suhu hangat karena produksi panas tubuhnya sudah berlebih.\n• Terang dan bising: Bising akan meningkatkan kecemasan dan denyut jantung (takikardia) pasien yang sudah hiperaktif.\n• Isolasi ketat: Penyakit tiroid bukan penyakit infeksi menular, isolasi ketat tidak relevan.\n• Bebas alergen: Relevan untuk penderita Asma, bukan kelainan endokrin (Grave's disease)." },
          { id: 24, rumpun: "KMB", text: "Pasien dirawat dengan kolostomi hari ke-3 pasca operasi kanker kolon. Stoma tampak berwarna merah muda terang dan lembab. Interpretasi perawat?", options: ["Tanda infeksi stoma", "Tanda nekrosis awal", "Tanda dehidrasi", "Kondisi stoma normal sehat", "Tanda iritasi feses"], correctAnswer: 3, explanation: "Rasional: Mukosa stoma adalah bagian dari usus bagian dalam yang dikeluarkan. Tampilan fisik stoma yang normal dan sehat, menunjukkan sirkulasi/vaskularisasi darah yang sangat baik, adalah berwarna merah muda cerah (pink) hingga merah daging (beefy red) dan teksturnya lembab mengkilap.\n\nAnalisis Pilihan Lain:\n• Tanda infeksi stoma: Infeksi ditandai dengan warna merah tua meradang, nyeri bengkak, dan keluar nanah purulen.\n• Tanda nekrosis awal: Jika suplai darah putus (iskemia/nekrosis), stoma akan berubah warna menjadi ungu gelap, biru kehitaman, atau hitam pucat kusam.\n• Tanda dehidrasi: Stoma yang dehidrasi akan tampak kering dan pucat, bukan lembab.\n• Tanda iritasi feses: Iritasi biasanya mengenai kulit sekitar (peristomal skin) menjadi merah melepuh, bukan stomanya itu sendiri." },
          { id: 25, rumpun: "KMB", text: "Pasien terpasang WSD (Water Seal Drainage). Saat pasien inspirasi, cairan di selang water seal naik, dan saat ekspirasi cairan turun (Undulasi positif). Maknanya?", options: ["Paru sudah mengembang maksimal", "Terdapat kebocoran sistem WSD", "Selang WSD tersumbat bekuan darah", "Sistem WSD berfungsi normal (Paten)", "Pasien butuh suction"], correctAnswer: 3, explanation: "Rasional: Fluktuasi air pada botol water seal (undulasi/tidaling) yang selaras dengan irama napas (naik saat inspirasi paru narik negatif, turun saat ekspirasi paru dorong positif) adalah tanda klinis paling akurat yang menunjukkan bahwa selang WSD 'PATEN' (tidak tersumbat) dan sistem kedap udara paru masih berjalan normal.\n\nAnalisis Pilihan Lain:\n• Paru mengembang maksimal: Jika paru sudah ekspansi sempurna dan nempel dinding dada, undulasi justru akan BERHENTI/HILANG karena tidak ada lagi ruang fluktuasi pleura.\n• Kebocoran sistem: Kebocoran (air leak) ditandai dengan adanya gelembung udara terus menerus (bubbling) di botol water seal, bukan sekadar undulasi air naik-turun.\n• Selang tersumbat: Jika selang kinking atau tersumbat bekuan darah, undulasi cairan akan LANGSUNG BERHENTI walau pasien menarik napas.\n• Butuh suction: Suction tambahan di botol WSD (wet suction control) dinilai dari botol ketiga, bukan parameter undulasi botol kedua." },
          { id: 26, rumpun: "KMB", text: "Pasien perempuan post mastektomi payudara kanan hari ke-2. Edukasi yang dilarang pada lengan kanan pasien?", options: ["Latihan pergerakan jari", "Pengukuran tekanan darah", "Elevasi lengan di atas bantal", "Pemakaian baju kancing depan", "Menyisir rambut sendiri"], correctAnswer: 1, explanation: "Rasional: Pasca Mastektomi, pengangkatan kelenjar getah bening aksila menyebabkan terhambatnya drainase limfatik lengan ipsilateral (sisi yang sama). Mengukur tekanan darah (menggunakan manset menjepit ketat), memasang infus, atau mengambil darah dilarang mutlak di sisi lengan yang dioperasi karena memicu Lymphedema (pembengkakan kronis lengan yang parah).\n\nAnalisis Pilihan Lain:\n• Latihan jari: Sangat DIANJURKAN sejak hari pertama pasca op untuk menjaga tonus dan memompa limfatik.\n• Elevasi lengan: DIANJURKAN untuk membantu gravitasi aliran balik cairan limfe ke pusat.\n• Baju kancing depan: Sangat praktis agar pasien tidak kesulitan memutar lengan mengangkat baju.\n• Menyisir rambut: Merupakan exercise ringan ADL (wall climbing/menyisir) yang dianjurkan untuk mencegah kaku bahu." },
          { id: 27, rumpun: "KMB", text: "Laki-laki 50 th dengan glaukoma sudut terbuka kronis. Keluhan utama yang biasanya dilaporkan pasien?", options: ["Melihat tirai hitam turun", "Nyeri mata hebat mendadak", "Kehilangan penglihatan perifer (tunnel vision)", "Mata merah berair", "Pandangan ganda (diplopia)"], correctAnswer: 2, explanation: "Rasional: Glaukoma sudut terbuka kronis adalah si 'pencuri penglihatan diam-diam' karena peningkatan Tekanan Intraokular merusak saraf optik dari bagian pinggir. Gejala patognomoniknya adalah hilangnya lapang pandang sisi samping (perifer) perlahan hingga menyisakan pandangan tengah seperti melihat dari corong (Tunnel Vision).\n\nAnalisis Pilihan Lain:\n• Melihat tirai hitam turun: Tanda khas (patognomonik) dari Ablasio Retina (Retinal Detachment), yaitu lepasnya retina secara darurat.\n• Nyeri mata mendadak: Gejala khas Glaukoma Sudut Tertutup AKUT, yang sifatnya darurat mata merah nyeri tembus ke kepala (bukan yang kronis terbuka).\n• Mata merah berair: Lebih merujuk ke konjungtivitis atau iritasi.\n• Pandangan ganda: Diplopia mengarah ke masalah saraf otak (stroke/myasthenia gravis) atau masalah lensa mata, bukan Glaukoma." },
          { id: 28, rumpun: "KMB", text: "Pasien paska operasi katarak. Untuk mencegah peningkatan Tekanan Intraokuler (TIO), posisi tidur yang disarankan?", options: ["Miring ke sisi mata yang dioperasi", "Tengkurap (Prone)", "Telentang dengan bantal (Semi fowler 30 derajat)", "Tidur datar tanpa bantal", "Posisi Trendelenburg"], correctAnswer: 2, explanation: "Rasional: Elevasi bagian kepala (Semi fowler 30-45 derajat) dengan menggunakan beberapa bantal sangat efektif untuk mengurangi tekanan vena di kepala dan menurunkan Tekanan Intraokular (TIO) paska operasi mata melalui bantuan gravitasi.\n\nAnalisis Pilihan Lain:\n• Miring ke sisi dioperasi: SANGAT DILARANG, menindih mata yang dioperasi menyebabkan tekanan langsung ekstrim dan merusak lensa/jahitan mikro mata.\n• Tengkurap (Prone): Gravitasi cairan wajah ke bawah akan menaikkan tekanan intraokular secara drastis.\n• Tidur datar tanpa bantal: Menahan akumulasi cairan di area okular dan serebral, meningkatkan TIO perlahan.\n• Trendelenburg (kaki lebih tinggi): Paling DILARANG, aliran darah besar menumpuk di kepala (meningkatkan ICP dan IOP drastis memicu robek mata paska operasi)." },
          { id: 29, rumpun: "KMB", text: "Pasien meningitis mengeluh kaku leher. Saat perawat memfleksikan leher pasien ke dada, kedua lutut pasien secara involunter ikut menekuk. Tanda ini disebut?", options: ["Kernig sign positif", "Brudzinski I positif", "Brudzinski II positif", "Babinski positif", "Chvostek sign positif"], correctAnswer: 1, explanation: "Rasional: Tanda Brudzinski I (Neck Sign) adalah uji klasik iritasi meningeal (selaput otak). Ketika leher difleksikan (ditekuk ke dada) secara pasif oleh perawat, terjadi fleksi refleksif (menekuk sendirinya) pada pinggul dan kedua lutut pasien akibat nyeri renggangan selaput saraf tulang belakang yang meradang.\n\nAnalisis Pilihan Lain:\n• Kernig sign positif: Meluruskan/ekstensi lutut dari posisi pinggul fleksi 90 derajat yang terhambat nyeri <135 derajat.\n• Brudzinski II (Leg Sign): Menekuk satu lutut secara pasif memicu lutut sebelah satunya ikut menekuk secara refleks.\n• Babinski positif: Menggores telapak kaki memicu jari-jari mekar ekstensif (tanda kerusakan Upper Motor Neuron pada orang dewasa), tidak spesifik meningitis.\n• Chvostek sign: Ketukan di pipi memicu kejang otot wajah, tanda khas defisiensi Kalsium (Hipokalsemia/Tetani)." },
          { id: 30, rumpun: "KMB", text: "Pasien dengan Parkinson disease. Tanda cardinal (tanda utama) penyakit ini adalah?", options: ["Tremor saat istirahat, rigiditas, bradikinesia", "Kejang tonik klonik", "Kelumpuhan sebelah badan", "Hilang ingatan jangka pendek", "Halusinasi visual persisten"], correctAnswer: 0, explanation: "Rasional: Parkinson's Disease terjadi akibat defisit neurotransmitter Dopamin di ganglia basalis otak. Penyakit ini dikenali dari 3 tanda utama (Trias Motorik klasik): Resting Tremor (gemetar saat diam seperti menggulung pil), Rigiditas otot (kekakuan seperti roda gigi), dan Bradikinesia (pergerakan melambat misal langkah diseret/shuffling gait).\n\nAnalisis Pilihan Lain:\n• Kejang tonik klonik: Gejala khas kelainan listrik otak primer, yaitu Epilepsi.\n• Kelumpuhan sebelah badan: Gejala khas Stroke (infark/hemoragik otak unilateral).\n• Hilang ingatan jangka pendek: Tanda awal dari penyakit Demensia/Alzheimer, bukan kelainan motorik Parkinson.\n• Halusinasi visual: Kelainan psikiatri (Skizofrenia) atau delirium organik lanjutan, bukan gejala awal motorik Parkinson." },
          { id: 31, rumpun: "KMB", text: "Pasien HNP (Herniated Nucleus Pulposus) area lumbal mengeluh nyeri punggung menjalar ke kaki. Tes pengkajian spesifik keperawatan saraf?", options: ["Phalen Test", "Tinel Test", "Straight Leg Raise (Lasègue test)", "Romberg Test", "Weber Test"], correctAnswer: 2, explanation: "Rasional: Lasègue Test atau Straight Leg Raise (SLR) adalah uji diagnostik standar emas klinis untuk mengecek adanya kompresi akar saraf punggung bawah (HNP Lumbal atau Sciatica). Mengangkat lurus tungkai pasien dari ranjang secara pasif akan memicu nyeri listrik tajam merambat ke punggung/pantat.\n\nAnalisis Pilihan Lain:\n• Phalen Test: Menyatukan punggung tangan, digunakan untuk diagnosa jepitan saraf pergelangan tangan (Carpal Tunnel Syndrome/CTS).\n• Tinel Test: Mengetuk pergelangan tangan, juga untuk diagnosa CTS di tangan.\n• Romberg Test: Pasien disuruh berdiri menutup mata. Untuk tes keseimbangan propioseptif telinga dalam dan otak kecil.\n• Weber Test: Menggunakan garputala di puncak kepala untuk tes ketulian konduktif vs sensorineural." },
          { id: 32, rumpun: "KMB", text: "Pasien Gastritis kronis mengalami Anemia Pernisiosa. Kekurangan vitamin apa yang menyebabkan hal ini?", options: ["Vitamin C", "Vitamin B1 (Tiamin)", "Vitamin B6 (Piridoksin)", "Vitamin B12 (Kobalamin)", "Vitamin K"], correctAnswer: 3, explanation: "Rasional: Lambung manusia memproduksi sel parietal yang mengeluarkan 'Faktor Intrinsik'. Faktor intrinsik mutlak dibutuhkan usus untuk bisa menyerap Vitamin B12. Jika lambung rusak kronis (gastritis atrofi/Ca lambung), tidak ada faktor intrinsik, Vitamin B12 tak bisa diserap. Kekurangan B12 memicu kegagalan pembentukan sel darah merah yang disebut Anemia Pernisiosa.\n\nAnalisis Pilihan Lain:\n• Vitamin C: Kekurangan memicu Scurvy (gusi berdarah, luka sulit sembuh).\n• Vitamin B1 (Tiamin): Kekurangan parah memicu penyakit Beri-beri (neuropati perifer dan masalah jantung) atau sindrom Wernicke-Korsakoff.\n• Vitamin B6: Terkait fungsi saraf perifer murni.\n• Vitamin K: Berperan untuk jalur kaskade pembekuan darah (koagulasi hepar), bukan produksi sel darah merah langsung." },
          { id: 33, rumpun: "KMB", text: "Laki-laki dirawat dengan Batu Saluran Kemih (Urolithiasis). Pasien dianjurkan banyak minum 3 liter/hari. Tujuannya?", options: ["Menurunkan tekanan darah", "Melarutkan asam urat", "Membilas (flushing) batu agar turun", "Mencegah retensi air", "Menurunkan nyeri kolik"], correctAnswer: 2, explanation: "Rasional: Asupan cairan yang sangat tinggi (hidrasi 3-4 liter) pada pasien Batu Saluran Kemih (BSK) berfungsi meningkatkan volume dan debit urin. Debit aliran kencing yang kencang ini menciptakan efek pembilasan (Flushing effect) yang kuat untuk secara mekanis mendorong batu-batu kecil/pasir keluar spontan menuju uretra dan membuangnya.\n\nAnalisis Pilihan Lain:\n• Menurunkan tekanan darah: Hidrasi tinggi justru cenderung menambah volume darah ringan, tidak berfungsi menurunkan TD penderita hipertensi.\n• Melarutkan asam urat: Hanya batu jenis asam urat murni yang bisa sedikit dilarutkan obat, sebagian besar BSK adalah batu kalsium oksalat yang tidak larut oleh air minum.\n• Mencegah retensi air: Kurang relevan secara langsung sebagai tujuan terapi BSK.\n• Menurunkan nyeri kolik: Nyeri ginjal BSK turun HANYA JIKA batu tersebut sudah berhasil didorong keluar; perbanyak minum tidak memiliki efek analgetik menumpulkan reseptor saraf." },
          { id: 34, rumpun: "KMB", text: "Perempuan dengan SLE (Lupus) muncul ruam merah berbentuk kupu-kupu (butterfly rash) di wajah. Edukasi perlindungan kulit utama?", options: ["Gunakan pelembab alkohol", "Hindari paparan sinar matahari langsung (UV)", "Cuci muka dengan sabun antiseptik kuat", "Lakukan eksfoliasi rutin", "Gunakan krim steroid dosis tinggi bebas"], correctAnswer: 1, explanation: "Rasional: Fotosensitivitas adalah manifestasi khas penyakit Systemic Lupus Erythematosus (SLE). Sinar Ultraviolet (UV) memicu apoptosis sel (kematian sel mati) di kulit wajah, di mana antibodi salah tafsir dan menyerang serpihan sel tersebut, memicu flare-up (kekambuhan parah) butterfly rash dan gejala sistemik lupus lainnya.\n\nAnalisis Pilihan Lain:\n• Pelembab alkohol: Alkohol mengiritasi dan sangat mengeringkan (drying effect) kulit Lupus yang sudah meradang sensitif.\n• Sabun antiseptik kuat: Sabun antibakteri keras akan merusak lapisan pelindung asam (acid mantle) kulit dan memicu luka perih meradang.\n• Eksfoliasi rutin: Pengelupasan kulit (scrub) melukai mekanis ruam lupus yang sedang inflamasi parah.\n• Krim steroid bebas: Dilarang keras dipakai bebas tanpa kontrol dokter karena penipisan kulit ireversibel (atrofi)." },
          { id: 35, rumpun: "KMB", text: "Pasien Dengue Hemorrhagic Fever (DHF) hari ke-4. Trombosit 40.000, terdapat petekie. Pasien menggosok gigi dan gusinya berdarah. Intervensi perawat?", options: ["Hentikan sikat gigi, ganti dengan obat kumur", "Berikan sikat gigi bulu kasar", "Berkumur dengan air es saja", "Berikan Injeksi Vitamin K", "Lakukan tamponade gusi"], correctAnswer: 0, explanation: "Rasional: Trombositopenia berat (keping darah turun <100k, pada kasus ini 40k) menyebabkan kegagalan pembekuan darah primer seketika. Trauma gesekan mekanis ringan dari sikat gigi saja memicu perdarahan gusi masif. Intervensi keperawatan teraman adalah mengganti manipulasi mekanik sikat dengan bilasan kimia/air (obat kumur/mouthwash lembut).\n\nAnalisis Pilihan Lain:\n• Sikat bulu kasar: SANGAT BAHAYA, akan memperparah perdarahan memicu perdarahan hebat tak terkontrol di mulut.\n• Berkumur es saja: Efek dingin memang vasokonstriksi, namun esktrem dingin bisa merusak mukosa rapuh; mouthwash antiseptik ringan lebih dianjurkan.\n• Injeksi Vitamin K: Vitamin K diberikan untuk perdarahan akibat gangguan fungsi pembekuan darah Liver (protrombin), bukan karena kurang keping keping trombosit DHF.\n• Tamponade gusi: Tindakan bedah gigi (menjahit/kasa tekan gusi), bukan ranah mandiri perawat pertama sebelum mengedukasi stop sikat." },
          { id: 36, rumpun: "KMB", text: "Pasien terpasang trakeostomi hari ke-2. Sekret kental terdengar. Tekanan suction yang aman untuk pasien dewasa?", options: ["60 - 80 mmHg", "80 - 120 mmHg", "150 - 200 mmHg", "200 - 250 mmHg", "10 - 20 mmHg"], correctAnswer: 1, explanation: "Rasional: Menurut standar keselamatan pernapasan (SOP Suction EBP), tekanan vakum (suction wall pressure) yang aman dan direkomendasikan untuk orang dewasa adalah di rentang 80 hingga 120 mmHg. Ini cukup kuat menyedot lendir namun cukup lembut menjaga lapisan dinding nafas.\n\nAnalisis Pilihan Lain:\n• 60-80 mmHg: Tekanan ini direkomendasikan untuk bayi baru lahir (neonatus) dan bayi kecil (infant), terlalu lemah menghisap sekret pekat dewasa.\n• 150-200 mmHg: SANGAT BERBAHAYA. Tekanan di atas 150 mmHg pada dewasa akan menghisap dan merobek jaringan mukosa (barotrauma mukosa), menyebabkan perdarahan aktif trakea dan hipoksia fatal.\n• 200-250 mmHg: Tekanan mesin vakum industri, bukan medis manusia.\n• 10-20 mmHg: Tekanan yang nyaris tidak ada daya sedotnya, tidak berguna." },
          { id: 37, rumpun: "KMB", text: "Pasien terpasang NGT (Nasogastric Tube). Sebelum memberikan makanan (feeding), perawat harus mengecek residu lambung. Berapa batas residu cairan (menunda makan)?", options: ["> 10 cc", "> 50 cc", "> 100-150 cc (atau >50% dari volume sebelumnya)", "> 1000 cc", "> 5 cc"], correctAnswer: 2, explanation: "Rasional: Pengecekan residu NGT memastikan lambung berfungsi mengosongkan makanan sebelumnya ke usus. EBP standar menetapkan pemberian makanan enteral (feeding) harus DITUNDA dan dokter dilaporkan jika volume residu aspirasi yang ditarik lebih dari 100-150 cc, atau lebih dari 50% volume pemberian makanan jam sebelumnya (risiko aspirasi muntah tinggi).\n\nAnalisis Pilihan Lain:\n• > 10 cc & > 50 cc: Ini adalah volume lambung normal yang sedang mencerna. Menunda makan di angka 50 cc akan membuat pasien malnutrisi panjang.\n• > 1000 cc: Ini sudah masuk fase akut ileus paralitik atau dilatasi lambung beracun, terlambat kalau baru ditunda saat mencapai 1 liter.\n• > 5 cc: Terlalu kecil, hanya residu cairan asam lambung alamiah." },
          { id: 38, rumpun: "KMB", text: "Laki-laki 60 th suspect Ca Paru. Hasil lab AGD: pH 7.25, PCO2 55, HCO3 24. Interpretasi Analisa Gas Darah?", options: ["Asidosis Metabolik", "Alkalosis Respiratorik", "Asidosis Respiratorik", "Alkalosis Metabolik", "Normal"], correctAnswer: 2, explanation: "Rasional: Pembacaan Analisa Gas Darah 3 langkah: 1. pH (Normal 7.35-7.45). Di sini pH 7.25 artinya ASIDOSIS (Asam). 2. PCO2 (Faktor Paru, Normal 35-45). Di sini PCO2 55 (Tinggi/Asam). 3. HCO3 (Faktor Ginjal, Normal 22-26). Di sini HCO3 24 (Normal). Kesimpulan: Karena pH dan PCO2 searah menunjuk Asam dan organ paru, maka Diagnosanya adalah ASIDOSIS RESPIRATORIK yang belum terkompensasi ginjal.\n\nAnalisis Pilihan Lain:\n• Asidosis Metabolik: Terjadi jika PCO2 normal dan HCO3 turun tajam (<22 mEq/L).\n• Alkalosis Respiratorik: Terjadi jika pH tinggi (basa >7.45) dan PCO2 rendah membuang asam (<35 mmHg).\n• Alkalosis Metabolik: Terjadi jika pH tinggi (basa >7.45) dan HCO3 tinggi membuang asam (>26 mEq/L).\n• Normal: Parameter pH dan CO2 jelas berada di luar rentang angka normal biokimiawi." },
          { id: 39, rumpun: "KMB", text: "Pasien Hepatitis B. Rute penularan penyakit ini yang harus diwaspadai perawat adalah?", options: ["Fecal-oral (makanan/minuman)", "Droplet (batuk/bersin)", "Airborne (udara)", "Bloodborne (darah dan cairan tubuh)", "Gigitan serangga"], correctAnswer: 3, explanation: "Rasional: Virus Hepatitis B dan Hepatitis C tergolong virus Bloodborne pathogen. Ia HANYA menular melalui kontak langsung cairan tubuh manusia yang terinfeksi masuk ke tubuh lain. Transmisi via: darah (jarum suntik bergantian, transfusi darah tercemar, luka perawat tertusuk jarum), hubungan seksual tanpa pengaman, dan cairan transmisi ibu ke janin (vertikal).\n\nAnalisis Pilihan Lain:\n• Fecal-oral (makanan tercemar tinja pasien): Ini adalah rute penularan mutlak untuk Hepatitis A dan Hepatitis E, bukan Hep B.\n• Droplet (batuk bersin): Ini adalah rute transmisi kuman flu besar (COVID, Difteri, Pertusis).\n• Airborne (udara terbang): Transmisi untuk partikel melayang (TBC Paru, Campak, Cacar Air).\n• Gigitan serangga: Vektor perantara penyakit seperti Dengue, Malaria, bukan radang liver Hepatitis B." },
          { id: 40, rumpun: "KMB", text: "Pasien CHF terpasang terapi Oksigen Nasal Kanul 3 Liter/menit. Berapa estimasi FiO2 (fraksi oksigen) yang didapat?", options: ["21%", "24%", "28%", "32%", "40%"], correctAnswer: 3, explanation: "Rasional: Rumus praktis internasional perhitungan FiO2 (Fraction of Inspired Oxygen) sistem aliran rendah Nasal Kanul per Lpm oksigen: Rumus = 20% (udara ruangan bebas) + (4 x liter oksigen). Jadi, Nasal Kanul 3 Liter = 20 + (4 x 3) = 20 + 12 = 32% Oksigen masuk paru pasien.\n\nAnalisis Pilihan Lain:\n• 21%: Adalah konsentrasi Oksigen normal udara ruangan di luar (tanpa memakai alat oksigen sama sekali).\n• 24%: Nasal kanul kecepatan aliran 1 Liter per menit.\n• 28%: Nasal kanul kecepatan aliran 2 Liter per menit.\n• 40%: Batas maksimal Nasal kanul di 5-6 Liter per menit, atau menggunakan Sungkup Muka Sederhana (Simple Mask)." },

          // --- ANAK (41-55) ---
          { id: 41, rumpun: "Anak", text: "Bayi 9 bulan Diare 10x/hari. Tampak letargis, mata sangat cekung, turgor perut kembali sangat lambat. Derajat dehidrasi menurut MTBS?", options: ["Tanpa dehidrasi", "Dehidrasi ringan", "Dehidrasi sedang", "Dehidrasi berat", "Diare persisten"], correctAnswer: 3, explanation: "Rasional: Pedoman bagan MTBS (Manajemen Terpadu Balita Sakit) Depkes membagi diare. Kriteria Dehidrasi Berat wajib ada 2 dari 4 tanda: 1. Letargis/TIDAK SADAR, 2. Mata Cekung, 3. Tidak bisa minum/malas minum, 4. Turgor kulit kembali SANGAT lambat (>2 detik). Karena bayi ini letargis dan turgor sangat lambat, mutlak diklasifikasi Dehidrasi Berat.\n\nAnalisis Pilihan Lain:\n• Tanpa dehidrasi: Salah, jelas anak menunjukkan tanda hipovolemia (mata cekung).\n• Dehidrasi ringan/sedang: Salah, kriteria ringan/sedang itu anaknya rewel/gelisah dan turgor kulit kembalinya lambat biasa (bukan sangat lambat), belum sampai letargis kolaps.\n• Diare persisten: Salah, klasifikasi ini berdasarkan waktu hari (Diare berlangsung >14 hari), sedangkan soal ini membahas derajat keparahan cairan (Dehidrasi).\n• Pilihan lain tidak relevan." },
          { id: 42, rumpun: "Anak", text: "Anak 3 tahun mengalami kejang demam di rumah. Tiba di IGD kejang sudah berhenti. Suhu 39,2°C. Prioritas edukasi untuk orang tua jika kejang berulang di rumah?", options: ["Masukkan sendok ke mulut anak", "Tahan tubuh anak dengan kuat", "Baringkan anak miring di tempat aman dan jauhkan benda tajam", "Berikan minum segera", "Langsung bawa lari ke IGD saat anak masih kejang"], correctAnswer: 2, explanation: "Rasional: Penanganan kejang pediatrik (Febrile Seizure) di komunitas fokus pada pencegahan trauma dan Aspirasi napas. Membaringkan anak di posisi miring (Recovery Position) membuat muntah/ludah mengalir keluar tidak menutup jalan napas (Airway terjamin), dan menjauhkan benda tajam melindungi dari cedera fisik benturan saat kejang motorik memuncak.\n\nAnalisis Pilihan Lain:\n• Masukkan sendok: MITOS BERBAHAYA. Memasukkan benda keras merusak gigi anak, melukai gusi, merobek mulut, dan bisa menyebabkan potongan gigi patah masuk paru (aspirasi letal).\n• Tahan tubuh kuat: DILARANG KERAS, menekan/menahan paksa gerakan otot spastik anak saat kejang justru berisiko tinggi mematahkan (fraktur) tulang balita.\n• Berikan minum segera: Dilarang memberi apapun via oral saat kejang atau pasca sadar bingung (post-iktal), anak pasti tersedak mati.\n• Bawa lari IGD saat kejang: Lebih baik mengamankan anak di tempat hingga kejang 2-3 menit reda, daripada menggendong anak spastik berlari jatuh bahaya." },
          { id: 43, rumpun: "Anak", text: "Bayi baru lahir dengan berat 2000 gram (BBLR). Suhu 36,0°C. Tindakan mandiri non-farmakologis terbaik menjaga kehangatan?", options: ["Inkubator suhu tinggi", "Perawatan Metode Kangguru (KMC)", "Bungkus bayi dengan plastik", "Letakkan di bawah sinar matahari langsung", "Mandi air hangat"], correctAnswer: 1, explanation: "Rasional: Kangaroo Mother Care (KMC) adalah prosedur non-farmakologis mandiri di mana bayi kontak kulit-ke-kulit (skin-to-skin) secara langsung dengan dada ibu/ayah. Metode ini terbukti klinis menyalurkan termoregulasi panas suhu konduksi stabil ibu untuk BBLR hipotermia (36.0), memicu rasa aman (bonding), dan menstabilkan HR bayi.\n\nAnalisis Pilihan Lain:\n• Inkubator: Ini adalah tindakan perabotan alat RS (tidak bisa dilakukan mandiri keluarga 24 jam) dan menghilangkan bonding emosional langsung.\n• Bungkus plastik: Plastik transparan memang menahan evaporasi sesaat bayi ekstrem prematur <1500g di awal persalinan IGD, tapi tidak menghangatkan aktif BBLR normal lama.\n• Matahari langsung: Sangat berbahaya memanggang BBLR kulit tipis di bawah UV, memicu luka bakar/hyperthermia radikal.\n• Mandi air hangat: Dilarang, memandikan BBLR (walau air hangat) memicu proses penguapan mendadak (evaporasi) yang malah menurunkan suhu tubuh bayi menjadi deklusi hipotermia mematikan." },
          { id: 44, rumpun: "Anak", text: "Anak 5 tahun dirawat karena Sindrom Nefrotik. Tubuh edema anasarka, protein urin ++++. Diet prioritas yang harus diperhatikan?", options: ["Tinggi kalsium", "Tinggi natrium", "Rendah natrium, protein adekuat tinggi", "Rendah kalori", "Tinggi cairan"], correctAnswer: 2, explanation: "Rasional: Patofisiologi Sindrom Nefrotik (Ginjal bocor) membuang semua Protein darah (Albumin) via ginjal (Urin ++++). Akibatnya darah kehilangan tenaga narik air, air lari ke rongga menyebabkan bengkak seluruh tubuh (Anasarka). Diet wajib adalah: Tinggi Protein (mengganti yang bocor dibuang) dan Rendah Natrium/Garam (mencegah garam menahan lebih banyak air merusak edema).\n\nAnalisis Pilihan Lain:\n• Tinggi Kalsium: Bukan fokus utama kelainan SN.\n• Tinggi Natrium: SANGAT DILARANG, natrium/garam tinggi akan menahan H2O berakibat edema paru fatal membunuh anak.\n• Rendah Kalori: Anak sakit butuh kalori normal/tinggi untuk imunitas.\n• Tinggi Cairan: DILARANG, ginjal sedang terendam beban air edema, anak harus retriksi cairan ketat." },
          { id: 45, rumpun: "Anak", text: "Anak 7 tahun dengan Thalasemia Mayor rutin transfusi darah. Muncul komplikasi kulit menghitam akibat penumpukan zat besi. Obat kelasi besi yang diberikan?", options: ["Vitamin C dosis tinggi", "Deferoxamine (Desferal)", "Eritropoietin", "Kalsium Glukonas", "Asam Folat"], correctAnswer: 1, explanation: "Rasional: Pasien Thalassemia seumur hidup transfusi PRC rutin. Setiap 1 kantong darah mengandung zat besi (iron) tinggi yang tidak bisa dibuang alami tubuh. Akumulasinya menempel di organ (jantung, liver, kulit abu-abu / Hemokromatosis). Desferal (Deferoxamine) adalah obat kelasi mutlak (iron chelating agent) yang mengikat besi membuangnya via urin merah.\n\nAnalisis Pilihan Lain:\n• Vitamin C dosis tinggi: Vit C JUSTRU MENINGKATKAN penyerapan besi usus, membahayakan anak thalasemia. Hanya diminum mikro dikombo desferal.\n• Eritropoietin: Hormon ginjal memproduksi sel darah, untuk pasien gagal ginjal, bukan solusi buang racun besi.\n• Kalsium Glukonas: Antidotum keracunan Magnesium Sulfat.\n• Asam Folat: Ini suplemen vitamin penunjang rutin Thalassemia untuk bahan eritrosit baru, BUKAN obat pembuang racun kelebihan besi." },
          { id: 46, rumpun: "Anak", text: "Bayi 3 bulan post-op Labiopalatoskizis (Bibir sumbing) hari pertama. Posisi tidur yang aman untuk mencegah kerusakan jahitan operasi?", options: ["Tengkurap (Prone)", "Telentang (Supine)", "Miring kanan kiri", "Kepala ekstensi", "Posisi knee-chest"], correctAnswer: 1, explanation: "Rasional: Pasca operasi jahit bibir dan langit-langit bayi (Cleft Lip Repair). Posisi teraman absolut adalah Telentang (Supine) murni. Hal ini mencegah kontak fisik dan gesekan mematikan antara wajah depan (area jahitan bibir) bayi dengan seprai/kasur yang bisa membuka luka bedah terbuka berdarah.\n\nAnalisis Pilihan Lain:\n• Tengkurap (Prone): SANGAT BERBAHAYA, bayi akan menggesek-gesekkan bibirnya yang baru dijahit ke kasur memicu pendarahan ruptur.\n• Miring: Bayi aktif rentan berguling ke tengkurap menekan bibir jahitannya.\n• Kepala ekstensi: Tidak relevan untuk menjaga bibir, malah memicu sumbatan trakea anatomis.\n• Knee-chest: Posisi bokong tinggi khas untuk anak jantung biru (Tet Spell), tidak hubungannya dengan operasi plastik mulut." },
          { id: 47, rumpun: "Anak", text: "Anak 4 tahun terdiagnosa Campak (Morbilli). Muncul ruam makulopapular. Ibu bertanya kapan anak boleh sekolah? (Fase penularan)", options: ["Saat demam mulai turun", "Sehari setelah ruam muncul", "Setidaknya 4-5 hari setelah ruam muncul", "Satu bulan kemudian", "Saat anak sudah mau makan"], correctAnswer: 2, explanation: "Rasional: Patofisiologi Infeksi Campak/Morbilli. Virus sangat ganas dan infeksius menular via droplet/airborne pada periode sekitar 4 hari SEBELUM ruam kemerahan meledak di kulit, hingga masa aman infeksi menurun 4 sampai 5 hari SESUDAH kemunculan ruam. Maka isolasi mandiri dari sekolah wajib dilanjutkan 5 hari pasca-ruam.\n\nAnalisis Pilihan Lain:\n• Demam turun: Tidak menjamin virus habis, demam sering turun padahal virus masih menular via percikan bersin.\n• Sehari setelah ruam: Itu justru sedang dalam fase puncak ledakan virus (viremia) sangat sangat menular.\n• Satu bulan kemudian: Terlalu berlebihan meliburkan sekolah, merugikan pendidikan anak (masa infeksius campak tak sepanjang itu).\n• Mau makan: Nafsu makan kembali bukan tolak ukur habisnya virus di ludah pernapasan morbilli." },
          { id: 48, rumpun: "Anak", text: "Jadwal Imunisasi dasar. Bayi usia 2 bulan, vaksin apa saja yang harusnya diberikan (Kemenkes)?", options: ["BCG, Polio 1", "DPT-HB-Hib 1, Polio 2, Rotavirus 1, PCV 1", "Campak/MR", "Hepatitis B0 saja", "DPT 3, Polio 4"], correctAnswer: 1, explanation: "Rasional: Berdasarkan program imunisasi wajib dasar PPI Kemenkes RI terbaru, bayi genap umur 2 Bulan wajib menerima paket perlindungan kombo, yaitu: Pentabio 1 (DPT, Hep-B, Hib 1), Polio tetes OPV 2, ditambah imunisasi PCV 1 (Pneumonia) dan Rotavirus 1 (Diare).\n\nAnalisis Pilihan Lain:\n• BCG & Polio 1: Ini adalah jadwal vaksinasi rutin untuk bayi berusia 1 BULAN (bersama dengan parut BCG).\n• Campak/MR: Ini adalah jadwal imunisasi dasar untuk bayi jauh lebih tua, yaitu di usia 9 BULAN.\n• Hepatitis B0 saja: Ini adalah vaksin Hbo pertama wajib yang diberikan mutlak pada bayi usia 0 (saat baru lahir maksimal <24 jam di ruang bersalin).\n• DPT 3 & Polio 4: Jadwal imunisasi untuk bayi berusia 4 BULAN (suntikan ketiga paha)." },
          { id: 49, rumpun: "Anak", text: "Bayi didiagnosa Penyakit Jantung Bawaan (PJB) Tetralogy of Fallot (TOF). Saat menangis, anak mendadak biru (Cyanotic Spell/Tet Spell). Posisi pertolongan pertama?", options: ["Knee-Chest position (lutut ke dada)", "Semi Fowler", "Trendelenburg", "Sim kanan", "Duduk tegak bersandar"], correctAnswer: 0, explanation: "Rasional: Anak TOF punya celah di jantung dan otot kaku memblok paru. Saat nangis/ngeden, otot memompa darah kotor ke seluruh tubuh bukan ke paru (Tet Spell) bikin otak hipoksia biru mematikan. Menekuk lutut ke dada perut (Knee-Chest/Squatting) menekan kuat arteri paha (femoralis), resistensi vaskular tubuh naik drastis memaksa tekanan darah ngedorong masuk kembali darah kotor memecah sumbatan masuk ke area Paru-paru dioksigenasi ulang.\n\nAnalisis Pilihan Lain:\n• Semi Fowler: Meninggikan dada hanya bantu pengembangan paru luar, tapi aliran darah biru sirkulasi jantung dalam tetap kolaps bocor.\n• Trendelenburg: Posisi syok ini membuat gravitasi darah balik jantung besar membebani jantung kanan kanan TOF melebar hancur.\n• Sim kanan/kiri: Posisi miring tidur tak ada pengaruh biomekanik jepitan vaskular menaikkan SVR (Systemic Vascular Resistance) penangkal Spell.\n• Duduk tegak bersandar: Aliran darah ekstremitas bawah terbuka lebar, tak merubah tekanan di ventrikel jantung membilas sumbatan." },
          { id: 50, rumpun: "Anak", text: "Anak usia 8 tahun dicurigai menderita Leukemia. Tanda klinis khas yang sering dikeluhkan orang tua?", options: ["Anak sering pingsan", "Pucat, mudah memar/perdarahan, nyeri tulang", "Diare persisten kronis", "Kejang tanpa demam", "Kelemahan otot ekstremitas bawah progresif"], correctAnswer: 1, explanation: "Rasional: Leukemia adalah kanker Sumsum Tulang Belakang (pabrik darah). Sel kanker blast memakan pabrik ini. Muncul Tanda Khas 3 Kegagalan Sumsum (Pansitopenia): Pabrik SDM rusak memicu Anemia (Pucat lemas), Pabrik Trombosit rusak (Memar lebam/berdarah gusi spontan). Selain itu invasi sel kanker meledakkan volume tulang dari dalam memicu Nyeri Tulang hebat (Bone Pain).\n\nAnalisis Pilihan Lain:\n• Sering pingsan: Tanda kelainan irama jantung/hiperglikemia, bukan gejala primer kanker sumsum.\n• Diare persisten kronis: Khas pada anak HIV/AIDS imun ancur infeksi oportunistik pencernaan atau Kelainan Celiac usus alergi, bukan darah.\n• Kejang tanpa demam: Gejala murni ke arah kelainan saraf otak (Epilepsi/Tumor otak fokal), bukan hematologi kanker darah cair.\n• Kelemahan otot ekstremitas bawah progresif: Tanda penyakit degenerasi otot Genetik seperti Duchenne Muscular Dystrophy (DMD) atau saraf Guillain Barre Syndrome." },
          { id: 51, rumpun: "Anak", text: "Pengkajian Apgar Score pada Bayi Baru Lahir menit ke-1: Tubuh merah kaki biru (1), Nadi 90 (1), Meringis (1), Fleksi ekstremitas (1), Napas lemah tak teratur (1). Total Skor?", options: ["4", "5", "6", "7", "8"], correctAnswer: 1, explanation: "Rasional: Penilaian APGAR menit ke-1 untuk asfiksia: \nA (Appearance/Warna) Acrosianosis tubuh merah kaki biru = Skor 1. \nP (Pulse/Nadi) <100 yakni 90 = Skor 1. \nG (Grimace/Refleks) Meringis kecil = Skor 1. \nA (Activity/Tonus Otot) fleksi lemah = Skor 1. \nR (Respiration/Napas) lemah meringkik = Skor 1.\nTOTAL SKOR MATEMATIS = 1 + 1 + 1 + 1 + 1 = 5 (Masuk kategori Asfiksia Sedang butuh oksigenasi resusitasi sedang).\n\nAnalisis Pilihan Lain:\n• 4: Hitungan kurang, salah matematika.\n• 6, 7, 8: Hitungan over, mungkin salah memasukkan skor normal 2 (misal keliru tubuh pink seluruh tubuh skor 2, padahal dia acrosianosis skor 1)." },
          { id: 52, rumpun: "Anak", text: "Anak 6 tahun mengompol saat tidur malam hari (Enuresis). Edukasi toilet training yang tepat untuk orang tua?", options: ["Hukum anak agar jera", "Gunakan popok terus menerus", "Batasi minum 2 jam sebelum tidur dan biasakan BAK sebelum tidur", "Beri obat antidiuretik", "Bangunkan anak setiap jam malam hari"], correctAnswer: 2, explanation: "Rasional: Mengompol (Enuresis Primer) nokturnal di usia 6 th sering karena kandung kemih belum kuat nahan dan tidur terlalu lelap. Terapi perilaku (Bladder Training/Conditioning) adalah first line (lini pertama): Secara ketat batasi masuknya air 2 jam sebelum jam tidur malam, dan buat rutinitas mutlak kencing paksa di kloset tepat sebelum sikat gigi memanjat kasur tidur.\n\nAnalisis Pilihan Lain:\n• Hukum anak: SANGAT DILARANG, menghukum anak ngompol menimbulkan stres dan rasa bersalah psikis (shame), justru membuat stres psikologis yang memperparah ngompolnya.\n• Popok terus: Popok (Diapers) membuat anak merasa 'nyaman' basah, menghilangkan kesadaran neurologis otak anak (sensor basah jijik) untuk bangun menahan kencing alamiah.\n• Obat antidiuretik: DDAVP (Desmopressin) hanya untuk terapi medis medis terakhir atas resep, bukan langkah dasar edukasi perawat/orangtua lini awal.\n• Bangunkan tiap jam: Menyiksa dan merusak kualitas tidur anak, menghambat hormon pertumbuhan (Growth Hormone)." },
          { id: 53, rumpun: "Anak", text: "Pemeriksaan refleks pada bayi baru lahir. Saat pipi bayi disentuh, kepala bayi menoleh ke arah sentuhan dan mulut membuka. Nama refleks?", options: ["Moro reflex", "Grasp reflex", "Rooting reflex", "Babinski reflex", "Sucking reflex"], correctAnswer: 2, explanation: "Rasional: Refleks Rooting (Refleks mencari akar/puting) adalah respon neurologis alamiah dan kuat bayi untuk bertahan hidup di awal menyusu. Rangsangan sentuhan pipi memicu mulut dan wajah menoleh melongo mencaplok mencari rangsangan ibu (payudara) persiapan nutrisi.\n\nAnalisis Pilihan Lain:\n• Moro reflex: Refleks kejut atau kaget saat bayi dijatuhkan mundur/ditepuk kasur kencang, tangannya mekrok memeluk.\n• Grasp reflex: Refleks jari tangan bayi menggenggam/mencengkeram sangat kuat saat ditaruh pulpen di telapak.\n• Babinski reflex: Tanda telapak kaki mekar ekstensi jari-jarinya ke atas saat tumitnya digores.\n• Sucking reflex: Refleks menghisap ngempeng kuat HANYA SAAT benda/puting SUDAH DIMASUKKAN masuk rongga mulut (Rooting mencari, Sucking menghisap)." },
          { id: 54, rumpun: "Anak", text: "Anak balita dirawat karena Kwashiorkor. Tanda klinis spesifik yang membedakannya dengan Marasmus?", options: ["Tubuh sangat kurus tinggal tulang", "Wajah keriput seperti orang tua", "Edema (bengkak) pada perut/ekstremitas", "Kulit kering bersisik", "Rambut hitam lebat"], correctAnswer: 2, explanation: "Rasional: Malnutrisi Energi Protein (MEP) parah ada 2: Marasmus & Kwashiorkor. Khas pembeda absolut penyakit Kwashiorkor (kurang Protein mutlak) adalah turunnya albumin darah drastis sehingga air keluar menumpuk bengkak (Edema Anasarka / Ascites cairan membesar di perut). Kwashiorkor anak terlihat 'gendut' bengkak air padahal sakit gizi mematikan.\n\nAnalisis Pilihan Lain:\n• Sangat kurus tulang: Ini Khas murni penyakit MARASMUS (kurang energi kalori ekstrim/lapar, badan menyusut lemak 0).\n• Wajah keriput orang tua: Khas MARASMUS (old man face) karena bantalan lemak wajah habis total dihisap tubuh untuk bertahan hidup.\n• Kulit kering bersisik: Ada di keduanya (Crazy pavement dermatosis), bukan pembeda spesifik spesialis.\n• Rambut hitam lebat: Salah, rambut Kwashiorkor justru rontok tipis merah jagung kusam (tanda dischromia protein akar rambut mati)." },
          { id: 55, rumpun: "Anak", text: "Bermain yang cocok untuk anak usia Toddler (1-3 tahun) di rumah sakit?", options: ["Bermain monopoli bersam teman", "Menyusun balok warna-warni (Parallel play)", "Membaca komik", "Bermain puzzle 100 keping", "Menonton film durasi panjang"], correctAnswer: 1, explanation: "Rasional: Tahap Tumbuh Kembang bermain Anak balita kelompok batita (Toddler 1-3 th) secara psikologis sosiologis berada pada fase PARALLEL PLAY. Mereka bermain sendiri-sendiri dengan mainan mandirinya NAMUN di ruang yang berdekatan dengan teman (tidak main patungan interaksi). Menyusun blok/balok kognitif aman warna-warni menyalurkan motorik kasar imajinasinya optimal.\n\nAnalisis Pilihan Lain:\n• Monopoli: Bermain kooperatif kompleks aturan ketat dengan uang, butuh usia sekolah SD yang paham negosiasi kekalahan.\n• Membaca komik: Butuh kemampuan linguistik bacaan abstrak (School Age/SD keatas).\n• Puzzle 100 keping: Kognitif Toddler belum mampu visual ruang menyusun puzzle kerumitan ekstrem tinggi itu (frustasi stres).\n• Film durasi panjang: Toddler punya Attention Span (rentang fokus konsentrasi) sangat pendek (<5 menit), ia tak bisa menahan diri duduk diam statis menatap layar sejam panjang." },

          // --- MATERNITAS (56-70) ---
          { id: 56, rumpun: "Maternitas", text: "Ibu Hamil G1P0A0 usia kehamilan 32 minggu datang ke poli. TFU (Tinggi Fundus Uteri) pertengahan pusat dan px. Perawat menghitung taksiran berat janin (Rumus Johnson). Jika kepala belum masuk PAP, konstanta pengurangannya?", options: ["11", "12", "13", "14", "15"], correctAnswer: 1, explanation: "Rasional: Estimasi TBJ (Taksiran Berat Janin) memakai formula rumus Johnson: (TFU fundus dalam cm - n/konstanta) x 155 gram. Syarat mutlak pengurang 'n' adalah 12 APABILA bagian terendah (kepala janin) MASIH MENGAMBANG di atas PAP (Pintu Atas Panggul) alias belum nyangkut masuk persalinan.\n\nAnalisis Pilihan Lain:\n• 11: Salah, ini dipakai jika kepala sudah benar-benar engaged masuk jauh ke dalam Hodge 3 panggul.\n• 13: Salah, pengurang khusus jika kepala HANYA menyentuh PAP belum masuk. (Teori buku 12/11 dominan dipakai standar nasional).\n• 14 & 15: Bukan konstanta resmi dalam rumus kebidanan obstetri Johnson-Toshach sedunia." },
          { id: 57, rumpun: "Maternitas", text: "Ibu G2P1A0 inpartu Kala 1 Fase Aktif. Pembukaan 7 cm. Ketuban pecah spontan, warna jernih. Kontraksi hebat tiap 3 menit. Pasien menangis kesakitan. Intervensi?", options: ["Pimpin meneran", "Ajarkan teknik effleurage (usapan perut) dan napas dalam", "Berikan induksi oksitosin", "Siapkan alat vakum ekstraksi", "Lakukan episiotomi"], correctAnswer: 1, explanation: "Rasional: Fase Aktif (Kala 1) pada pembukaan 7 cm, his kontraksi rahim paling nyeri tak tertahankan bagi ibu. Namun porsio rahim BELUM membuka total (10 cm). Intervensi perawat terbaik mutlak adalah dukungan psikologis non-farmakologis pereda nyeri: relaksasi napas dalam ritmis dan usapan pijatan halus punggung/perut (Effleurage) mengalihkan gerbang nyeri otak (Gate control theory).\n\nAnalisis Pilihan Lain:\n• Pimpin meneran: SANGAT MEMATIKAN IBU. Jika ibu dipimpin ngeden pada pembukaan 7, mulut rahim leher serviks yang masih tebal menjepit akan SOBEK berdarah hebat, dan janin asfiksia.\n• Induksi oksitosin: Tidak perlu dan berbahaya, karena his alami ibu sudah hebat (3 menit) murni kencang alamiah, ditambah oksitosin rahim bisa pecah (ruptur uteri).\n• Vakum ekstraksi: Hanya dilakukan oleh SpOG di Kala II (sudah pembukaan 10cm lengkap) jika ibu kolaps tak kuat ngeden bayi.\n• Episiotomi: Pengguntingan perineum vulva bawah untuk ibu ngeden Kala II." },
          { id: 58, rumpun: "Maternitas", text: "Bayi baru lahir normal. Plasenta belum lahir. Perawat menyuntikkan Oksitosin 10 IU IM. Tindakan apa selanjutnya pada manajemen aktif Kala III?", options: ["Eksplorasi rahim dengan tangan", "Menarik tali pusat kuat-kuat (traksi keras)", "Penegangan Tali Pusat Terkendali (PTT) dan masase fundus atas simfisis", "Injeksi methergin", "Biarkan plasenta lepas sendiri 2 jam"], correctAnswer: 2, explanation: "Rasional: Protokol MAK III (Manajemen Aktif Kala III Persalinan APN) adalah prosedur keselamatan perdarahan ibu lahir. Urutannya: 1. Injeksi Oksitosin 10 unit paha dalam. 2. Lakukan Penegangan Tali Pusat Terkendali (PTT) SATU ARAH bersamaan Masase fundus memutar tekan dorsokranial untuk membantu otot rahim mencekik pembuluh darah melepas perlahan akar plasenta.\n\nAnalisis Pilihan Lain:\n• Eksplorasi tangan (Manual Plasenta): Operasi kasar masukkan jari merogoh copot plasenta ke rahim dalam HANYA BILA PTT gagal plasenta nempel lengket 30 menit Retensio (sangat berisiko infeksi).\n• Menarik tali kuat keras: FATAL. Tali pusat akan putus di dalam, atau rahimnya terbalik ikut ketarik keluar vagina (Inversio Uteri) berdarah ibu meninggal.\n• Injeksi Methergin: Obat perdarahan sekunder (terakhir), bukan langkah dasar rutin MAK III.\n• Biarkan lepas 2 jam: Dilarang, lebih dari 30 menit plasenta tertinggal memicu perdarahan pasca melahirkan mematikan." },
          { id: 59, rumpun: "Maternitas", text: "Ibu postpartum 2 jam (Kala IV). Darah merembes banyak di pembalut. Pengkajian: Uterus teraba lembek, batas fundus sepusat. Diagnosa medis: Atonia Uteri. Tindakan pertama perawat?", options: ["Pasang infus guyur RL", "Masase fundus uteri 15 detik", "Lapor dokter kandungan segera", "Beri oksigen", "Injeksi Asam Traneksamat"], correctAnswer: 1, explanation: "Rasional: Uterus (Rahim) lembek tak ada tonus pasca lahiran (Atonia Uteri) adalah Pembunuh Nomor 1 Ibu Melahirkan berdarah (HPP). Tindakan pertama, instan, & paling cepat (MANDIRI) untuk merangsang kaku keras rahim adalah memijat/meremas bundaran rahim langsung di perut ibu (Masase Fundus Uteri 15 detik), memicu saraf rahim berkontraksi spontan menghentikan bocor kapiler.\n\nAnalisis Pilihan Lain:\n• Pasang infus guyur: Ini resusitasi cairan anti-Syok, penting, NAMUN keran pendarahan rahim harus 'dimatikan' dulu paksa dari pusat remasan Masase, baru air ditambah.\n• Lapor dokter: Lapor dilakukan BERSAMAAN ATAU SETELAH tangan perawat masuk masase rahim ibu menyelamatkan nyawa hitungan detik.\n• Oksigen: Sama dengan infus, mengatasi dampak turunnya perfusi darah HPP, bukan terapi utama rahimnya.\n• Asam Traneksamat: Obat medis IV pembeku darah akhir, bukan langkah pertolongan pertama henti darah mekanik uterus Atonia." },
          { id: 60, rumpun: "Maternitas", text: "Ibu hamil 36 minggu mengeluh pusing dan pandangan kabur. TD 160/110 mmHg, Proteinuria +3. Edema kaki +. Pasien didiagnosis Preeklamsia Berat (PEB). Obat antikejang profilaksis?", options: ["Diazepam IV", "Phenytoin", "Magnesium Sulfat (MgSO4)", "Kalsium Glukonas", "Nifedipin"], correctAnswer: 2, explanation: "Rasional: Magnesium Sulfat (MgSO4) adalah terapi absolut 'Drug of Choice' (Pilihan Emas Dunia Medis) untuk pelindung saraf otak ibu Hamil (neuroprotektif) mem-blok transmisi saraf otot sehingga mencegah kejang parah yang merusak otak ibu maupun bayi mati (Anti-Eklamsia profilaksis) pada Preeklamsia Berat tensi >160/110.\n\nAnalisis Pilihan Lain:\n• Diazepam IV: Obat bius kejang umum jiwa epilepsi, BUKAN untuk Preeklamsia hamil karena menyebabkan depresi penekanan napas fatal pada bayi lahir.\n• Phenytoin: Obat pemeliharaan jangka panjang epilepsi epilektikus.\n• Kalsium Glukonas: Ini BUKAN obat pencegah kejang, tapi penawar racun (antidotum) jika ibu keracunan overdosis Magnesium Sulfat hentinapas.\n• Nifedipin: Obat Antihipertensi oral minum penurun tekanan darahnya saja, BUKAN mencegah kejang listrik otaknya langsung." },
          { id: 61, rumpun: "Maternitas", text: "Syarat pemberian MgSO4 pada pasien preeklamsia berat, kecuali?", options: ["Frekuensi napas > 16x/m", "Refleks patella positif", "Urine output > 30 ml/jam", "Tersedia Kalsium Glukonas (Antidotum)", "Tekanan darah sistolik > 200 mmHg"], correctAnswer: 4, explanation: "Rasional: Pemberian Magnessium Sulfat sangat beracun depresan otot saraf. Aturan Bidan/Perawat MUTLAK: Tensi > 200 BUKAN SYARAT pemberian magnesium. Syarat Wajib Cuma 4: Nafas bagus (>16x/m), Reflek lutut Patela gerak (+) artinya saraf ga mati bius, Kencing pipis deras baik (>30cc/jam) agar racun MGSO4 bisa kebuang, dan wajib sedia Kalsium Glukonas penawar di samping ranjang.\n\nAnalisis Pilihan Lain:\n• Napas >16: Benar syarat mutlak, MgSO4 melumpuhkan otot napas, jika awal napas lambat (12x) diguyur ini ibu akan henti napas.\n• Patella positif: Benar syarat mutlak, hilangnya refleks sendi lutut patela adalah tanda keracunan berat (toksisitas) MgSO4 saraf medula mati.\n• Urine >30ml/jam: Benar syarat, karena MgSO4 100% dibuang via kencing ginjal. Jika oliguria urin mampet, MgSO4 muter racuni jantung darah.\n• Sedia Kalsium Glukonas: Benar syarat wajib siaga, injeksi penangkal racun mati seketika hentinapas MgSO4." },
          { id: 62, rumpun: "Maternitas", text: "Ibu hamil 28 minggu, perdarahan pervaginam merah segar SEGAR TANPA NYERI. Riwayat USG bulan lalu: Plasenta Previa Totalis. Tindakan yang KONTRAINDIKASI dilakukan perawat/bidan?", options: ["Pasang IV line besar", "Pantau DJJ", "Lakukan Pemeriksaan Dalam (Vaginal Touche / VT)", "Tirah baring mutlak", "Periksa kadar Hemoglobin"], correctAnswer: 2, explanation: "Rasional: Tanda Perdarahan Trimester 3 'TANPA NYERI' merah segar darah mengucur adalah khas patologis Plasenta Previa (Plasenta halangi/nempel numpuk di lubang leher jalan lahir). Melakukan colok vagina jari (Vaginal Touche/VT) SANGAT FATAL KONTRAINDIKASI, jari perawat akan mencoblos merobek plasenta menutupi lubang, memicu pendarahan banjir masif dan bayi ibu meninggal seketika di kasur.\n\nAnalisis Pilihan Lain:\n• Pasang IV line: Mutlak diperlukan untuk persiapan cairan antisipasi Syok HPP.\n• Pantau DJJ: Penting memantau janin apakah gawat stres.\n• Tirah baring mutlak: Bedrest menurunkan tekanan rahim ke plasenta.\n• Periksa Hemoglobin: Penting mengecek keparahan darah bocor indikasi persiapan transfusi darah PMI." },
          { id: 63, rumpun: "Maternitas", text: "Pasien nifas hari ke-3 mengeluh payudara bengkak, merah, keras, meradang, dan demam 38,5°C. Bayi rewel saat menyusu. Masalah keperawatan?", options: ["Ketidakefektifan pemberian ASI", "Nyeri akut", "Risiko Infeksi", "Mastitis (Infeksi Payudara)", "Engorgement fisiologis"], correctAnswer: 3, explanation: "Rasional: Bendungan ASI parah yang tak dikeluarkan memicu bakteri luar puting masuk menyerang jaringan payudara lecet. Data spesifik lokal (bengkak, sangat keras, MERAH meradang) ditambah data sistemik seluruh badan ibu (Demam klinis infeksi 38.5) adalah khas mutlak infeksi radang 'Mastitis Payudara'.\n\nAnalisis Pilihan Lain:\n• Ketidakefektifan ASI: Ini etiologi penyebab bayi rewel awal asupan, tapi tak menjelaskan merah meradang radang payudaranya.\n• Nyeri akut: Benar ibu nyeri, tapi Mastitis adalah masalah kolaborasi infeksi primer lebih komprehensif mengancam sepsis.\n• Risiko infeksi: Bukan 'risiko' lagi, ini sudah AKTUAL TERJADI infeksi radang abses demam (Mastitis).\n• Engorgement (bendungan fisiologis): Bendungan ASI hari 3 biasa payudara ibu memang keras full susu kencang pegal (Engorgement), TAPI tidak dibarengi demam tinggi patologis dan merah meradang parah." },
          { id: 64, rumpun: "Maternitas", text: "Hari Pertama Haid Terakhir (HPHT) seorang ibu adalah 10 Mei 2023. Taksiran Persalinan (HPL) menurut Rumus Naegele?", options: ["17 Februari 2024", "10 Februari 2024", "17 Maret 2024", "17 Januari 2024", "10 Maret 2024"], correctAnswer: 0, explanation: "Rasional: Rumus paten Naegele untuk HPHT (Haid Terakhir) HPL Kelahiran di bulan Januari s/d Maret adalah (Hari +7, Bulan +9). Untuk bulan April s/d Desember rumusnya (Hari +7, Bulan -3, Tahun +1). Kasus ini bulan Mei (Bulan 5). Matematika: Hari (10+7 = 17). Bulan (5-3 = Bulan 2 alias Februari). Tahun (2023+1 = 2024). Kesimpulan HPL jatuh tgl 17 Februari 2024.\n\nAnalisis Pilihan Lain:\n• 10 Februari 2024: Salah, lupa menambah rumus matematis tanggal (+7 hari).\n• 17 Maret 2024: Salah menghitung mundur bulan ke belakang, Mei mundur 3 bulan itu Februari.\n• 17 Januari 2024: Salah matematis bulan.\n• 10 Maret 2024: Salah tidak menambah hari dan salah memundurkan minus 3 bulan dari Mei." },
          { id: 65, rumpun: "Maternitas", text: "Wanita 35 th memiliki anak balita dan tidak ingin punya anak lagi selamanya (metode permanen). Kontrasepsi paling tepat?", options: ["Pil KB Kombinasi", "IUD (AKDR)", "Susuk / Implant", "Tubektomi (MOW)", "Kondom"], correctAnswer: 3, explanation: "Rasional: Ibu ini memiliki kata kunci indikasi KB 'TIDAK INGIN punya anak selamanya' alias menutup pabrik fertilitas secara final (Metode Kontrasepsi Mantap / Kontap Permanen). Pilihan metode bedah definitif satu-satunya untuk wanita memutus saluran telur rahim adalah MOW (Metode Operasi Wanita) atau Tubektomi.\n\nAnalisis Pilihan Lain:\n• Pil KB: KB jangka sangat sangat pendek (diminum tiap hari), cocok untuk menunda anak pertama/sementara, kalau lupa hamil lagi.\n• IUD (AKDR spiral): KB Jangka panjang (bisa 5-10 tahun) tapi BUKAN PERMANEN. Kalau dicabut subur hamil lagi.\n• Susuk/Implant KB: Hormonal dipasang di lengan, Jangka sedang (3 tahun), bisa dicabut hamil lagi.\n• Kondom: KB Penghalang (Barrier) insidentil sangat tidak permanen tingkat kegagalan bocor robek tinggi." },
          { id: 66, rumpun: "Maternitas", text: "Posisi meneran pada ibu bersalin normal yang dilarang/tidak direkomendasikan karena menekan vena cava inferior (menurunkan DJJ janin)?", options: ["Setengah duduk (Semi Fowler)", "Miring kiri", "Merangkak", "Jongkok", "Telentang datar (Supine)"], correctAnswer: 4, explanation: "Rasional: Posisi Telentang Terlentang Datar Lurus (Supine) di ranjang bersalin sangat DILARANG WHO. Rahim trimester 3 seberat balita dan air ketuban akan menggenjet menekan pembuluh darah balik utama punggung ibu (Vena Cava Inferior). Efeknya asupan darah balik ibu ke jantung kolaps (Sindrom Hipotensi Supine) dan bayi di dalam perut kecekik tak dapat pasokan oksigen darah dari plasenta jatuh stress DJJ mati lemas.\n\nAnalisis Pilihan Lain:\n• Semi Fowler: Posisi TERBAIK PALING DIANJURKAN RS, gaya gravitasi menolong bayi turun dan rahim tak menindih vena tulang belakang.\n• Miring Kiri: Posisi PALING BAGUS sirkulasi oksigen menyuplai plasenta bayi karena membebaskan jepitan vena cava di kanan perut.\n• Merangkak: Posisi bagus memutar bayi sungsang.\n• Jongkok: Posisi alamiah turunnya kepala gaya gravitasi melebarkan panggul 30%." },
          { id: 67, rumpun: "Maternitas", text: "Cairan ketuban (Lochia) yang keluar pada hari ke 1-3 post partum, berwarna merah terang muda berisi sisa darah. Disebut lochia?", options: ["Lochia Rubra", "Lochia Sanguinolenta", "Lochia Serosa", "Lochia Alba", "Lochia Purulenta"], correctAnswer: 0, explanation: "Rasional: Urutan fisiologis nifas pembuangan kotoran plasenta sisa darah di rahim (Lochia) ada fase patennya. Hari pertama ke-1 sampai ke-3 paska lahiran darah yg keluar masih murni segar luka plasenta berwarna merah terang/gelap (disebut LOCHIA RUBRA / merah).\n\nAnalisis Pilihan Lain:\n• Lochia Sanguinolenta: Hari ke 4 sampai ke 7 post partum, darah warna merah kecoklatan (campur lendir sedikit).\n• Lochia Serosa: Hari ke 7 sampai ke 14 post partum, warna cairan kuning cair bercampur serum tidak berdarah lagi.\n• Lochia Alba: Lebih dari hari ke-14 s/d 6 minggu nifas, warna putih bening selaput keputihan rahim sehat pulih.\n• Lochia Purulenta: BUKAN TAHAPAN NORMAL, ini adalah lochia patologis keluar cairan Kuning Kehijauan Nanah busuk tanda Ibu sedang Infeksi Endometritis berat nifas." },
